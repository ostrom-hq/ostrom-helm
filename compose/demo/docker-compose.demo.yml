# Local demo stack: Ostrom whole on one machine, with no real outside service. Started on top of the install's file:
#   docker compose -f docker-compose.yml -f demo/docker-compose.demo.yml up -d --wait     (demo/demo.sh does it)
# It adds, for the demo only:
#   - Mailpit and a relay, in place of Resend: the server writes its mails to a directory (OSTROM_MAIL_DIR), the relay
#     hands them to Mailpit, read at http://mail.localhost;
#   - a fake GitHub for « Continue with GitHub » (fake-github.mjs), at http://github.localtest.me, which also answers
#     for the providers' token endpoints the import's cutover calls;
#   - a fake TeamCode team in MySQL (demo/teamcode), for `ostrom import teamcode`;
#   - cloud sessions on this machine's Docker (OSTROM_RUNNERS_DRIVER=docker): the server reaches the engine through a
#     socket proxy on a network of its own, and each session's three containers (the agent host, the check host and
#     the runner, which alone holds the token, S2-49) join `ostrom-sessions`, an internal network where they reach the server and nothing else: no database, no engine,
#     no published port of this machine (Caddy, so the Mailpit inbox and its sign-in links), no internet.
# The Docker socket proxy can create containers: never run this file on a shared or exposed machine.
services:
  server:
    depends_on:
      mail-init: { condition: service_completed_successfully }
    environment:
      OSTROM_MAIL_DIR: /var/lib/ostrom-mail
      OSTROM_GITHUB_CLIENT_ID: Iv1.ostromdemo
      # Not a secret: the fake GitHub's own value, known to it and the server only, on this machine.
      OSTROM_GITHUB_CLIENT_SECRET: demo-client-secret-of-the-fake-github
      OSTROM_GITHUB_WEB_URL: http://github.localtest.me
      OSTROM_GITHUB_API_URL: http://github.localtest.me/api
      # The import's cutover renews the shared accounts' tokens at their provider: the fake answers in its place.
      OSTROM_SHARING_CLAUDE_TOKEN_URL: http://github.localtest.me/claude/oauth/token
      OSTROM_SHARING_CODEX_TOKEN_URL: http://github.localtest.me/codex/oauth/token
      OSTROM_RUNNERS_DRIVER: docker
      OSTROM_RUNNERS_DOCKER_API_URL: http://docker-api:2375
      OSTROM_RUNNERS_DOCKER_NETWORK: ostrom-sessions
      OSTROM_RUNNERS_SERVER_URL: http://server:8080
      OSTROM_RUNNERS_IMAGE: ${OSTROM_RUNNER_IMAGE:-ghcr.io/ostrom-hq/ostrom-runner:latest}
      OSTROM_RUNNERS_ALLOWED_ORGS: "*"
    volumes:
      - mail:/var/lib/ostrom-mail
    networks: [default, docker-api, sessions]

  # The mail directory belongs to the server's user (65532) before the server starts.
  mail-init:
    image: docker.io/library/busybox:1.37
    command: ["sh", "-c", "chown 65532:65532 /mail && chmod 0770 /mail"]
    restart: "no"
    volumes:
      - mail:/mail

  mailpit:
    image: docker.io/axllent/mailpit:v1.32.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 40

  mail-relay:
    image: docker.io/library/node:24-alpine
    restart: unless-stopped
    user: "65532:65532"
    command: ["node", "/demo/mail-relay.mjs"]
    depends_on:
      mail-init: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }
    environment:
      MAIL_DIR: /mail
      MAILPIT_URL: http://mailpit:8025
    volumes:
      - mail:/mail
      - ./demo:/demo:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  fake-github:
    image: docker.io/library/node:24-alpine
    restart: unless-stopped
    user: "1000:1000"
    command: ["node", "/demo/fake-github.mjs"]
    environment:
      PORT: "8080"
      FAKE_GITHUB_CLIENT_ID: Iv1.ostromdemo
      FAKE_GITHUB_CLIENT_SECRET: demo-client-secret-of-the-fake-github
    volumes:
      - ./demo:/demo:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40

  # A fake TeamCode team in TeamCode's own MySQL tables (demo/teamcode), for `ostrom import teamcode`: on this machine
  # only, at mysql://teamcode_ro@127.0.0.1:3307/teamcode (password in MYSQL_PWD: demo-teamcode-ro), its secrets sealed
  # with the fake key demo/teamcode/key.txt. Small: no performance schema, a 16 MiB buffer pool.
  teamcode-db:
    image: docker.io/library/mysql:8.4
    restart: unless-stopped
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=16M", "--skip-name-resolve"]
    environment:
      MYSQL_ROOT_PASSWORD: demo-teamcode-root
      MYSQL_DATABASE: teamcode
      TEAMCODE_RO_PASSWORD: demo-teamcode-ro
    volumes:
      - ./demo/teamcode/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./demo/teamcode/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./demo/teamcode/03-readonly.sh:/docker-entrypoint-initdb.d/03-readonly.sh:ro
    ports:
      - "127.0.0.1:3307:3306"
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=demo-teamcode-ro mysql -h127.0.0.1 -uteamcode_ro teamcode -e 'SELECT 1 FROM accounts LIMIT 1'"]
      interval: 3s
      timeout: 3s
      retries: 60

  # The Docker Engine API, limited to what the runtime driver calls (containers, volumes, image pulls), on a network
  # only the server joins.
  docker-api:
    image: docker.io/tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      VOLUMES: "1"
      IMAGES: "1"
      POST: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      INFO: "0"
      NETWORKS: "0"
      EXEC: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]

  caddy:
    depends_on: [server, web, fake-github, mailpit]
    environment:
      OSTROM_MAIL_HOST: ${OSTROM_MAIL_HOST:-mail.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile.install:ro
      - ./demo/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default:
        aliases: [github.localtest.me]

volumes:
  mail:

networks:
  default:
  docker-api:
    internal: true
  # Named as is: the server gives this name to the Docker engine for each session's containers. Internal: no route
  # out, to this machine (host-gateway) or the internet; only the server, which also joins `default`, is on it.
  sessions:
    name: ostrom-sessions
    internal: true
