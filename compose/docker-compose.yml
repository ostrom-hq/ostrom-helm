# Ostrom self-hosted, in one command: ./install.sh  (writes .env with fresh secrets, then `docker compose up -d`).
# Hosts default to *.localhost over plain HTTP; set OSTROM_API_HOST / OSTROM_APP_HOST / OSTROM_SSO_HOST to real
# names in .env and Caddy obtains the TLS certificates itself.
# Images: pinned by digest to a signed build of main (ostrom-infra prod/images.lock), until the first release tags
# exist. OSTROM_SERVER_IMAGE / OSTROM_WEB_IMAGE in .env override them (an image you built: see docs/install-docker.md).
name: ostrom

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: docker.io/library/postgres:17.6
    # Roles (postgres-init/10-roles.sh, the same script as the Helm chart): the superuser; `ostrom`, owner of the
    # database, for migrations only; `ostrom_app`, the server's role, which owns nothing and cannot bypass
    # row-level security; `polis`, with its own database.
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./install.sh first, it writes .env}
      OSTROM_DB: ostrom
      OSTROM_OWNER: ostrom
      OSTROM_OWNER_PASSWORD: ${OSTROM_OWNER_PASSWORD:?run ./install.sh first}
      OSTROM_APP: ostrom_app
      OSTROM_APP_PASSWORD: ${OSTROM_APP_PASSWORD:?run ./install.sh first}
      OSTROM_POLIS_PASSWORD: ${POLIS_DB_PASSWORD:?run ./install.sh first}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Migrations, once per `up`, with the owner's credentials: the server never receives them.
  migrate:
    image: ${OSTROM_SERVER_IMAGE:-ghcr.io/ostrom-hq/ostrom-server@sha256:47f4426aa907c0032925d8f263ced78249edf50ff90841fca3184eef29ddfa03}
    # The image's ENTRYPOINT is the binary: `command` gives only its arguments (Kubernetes' `command` replaces the
    # ENTRYPOINT instead, which is why the chart names the binary).
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      OSTROM_DATABASE_MIGRATION_URL: postgresql://ostrom:${OSTROM_OWNER_PASSWORD}@postgres:5432/ostrom
      OSTROM_DATABASE_MIGRATION_USER: ostrom
      OSTROM_DATABASE_MIGRATION_PASSWORD: ${OSTROM_OWNER_PASSWORD}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  server:
    <<: *restart
    image: ${OSTROM_SERVER_IMAGE:-ghcr.io/ostrom-hq/ostrom-server@sha256:47f4426aa907c0032925d8f263ced78249edf50ff90841fca3184eef29ddfa03}
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      OSTROM_DATABASE_URL: postgresql://postgres:5432/ostrom
      OSTROM_DATABASE_USER: ostrom_app
      OSTROM_DATABASE_PASSWORD: ${OSTROM_APP_PASSWORD}
      OSTROM_SIGNING_KEY_FILE: /var/lib/ostrom/instance-key.pem
      OSTROM_PUBLIC_URL: ${OSTROM_SCHEME:-http}://${OSTROM_API_HOST:-api.localhost}
      # The console's origin, the only one a browser session may change state from (it serves /api/v1, Caddyfile).
      OSTROM_CONSOLE_URL: ${OSTROM_SCHEME:-http}://${OSTROM_APP_HOST:-app.localhost}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    env_file:
      - path: ./server.env
        required: false
    volumes:
      - server-data:/var/lib/ostrom
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    <<: *restart
    image: ${OSTROM_WEB_IMAGE:-ghcr.io/ostrom-hq/ostrom-web@sha256:509b7beb1f4c17de132440f2cc6438c245a9f2c6286566f618a956331f815154}
    environment:
      OSTROM_API_UPSTREAM: http://server:8080
      OSTROM_API_URL: ${OSTROM_SCHEME:-http}://${OSTROM_API_HOST:-api.localhost}
      OSTROM_APP_URL: ${OSTROM_SCHEME:-http}://${OSTROM_APP_HOST:-app.localhost}
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101
      - /var/run/ostrom:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Ory Polis, the SAML bridge: coming soon, the server has no SAML code yet. Off unless the `sso` profile is on
  # (`COMPOSE_PROFILES=sso` in .env, or `docker compose --profile sso up -d`), like polis.enabled in the chart.
  polis:
    <<: *restart
    profiles: [sso]
    image: docker.io/boxyhq/jackson:26.2.0
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PORT: "5225"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      EXTERNAL_URL: ${OSTROM_SCHEME:-http}://${OSTROM_SSO_HOST:-sso.localhost}
      NEXTAUTH_URL: ${OSTROM_SCHEME:-http}://${OSTROM_SSO_HOST:-sso.localhost}
      SAML_AUDIENCE: ${POLIS_SAML_AUDIENCE:-https://saml.ostrom.run}
      DB_ENGINE: sql
      DB_TYPE: postgres
      DB_URL: postgres://polis:${POLIS_DB_PASSWORD}@postgres:5432/polis
      JACKSON_API_KEYS: ${POLIS_API_KEY:?run ./install.sh first}
      NEXTAUTH_SECRET: ${POLIS_NEXTAUTH_SECRET:?run ./install.sh first}
      DB_ENCRYPTION_KEY: ${POLIS_DB_ENCRYPTION_KEY:?run ./install.sh first}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5225/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60

  caddy:
    <<: *restart
    image: docker.io/library/caddy:2.10-alpine
    depends_on: [server, web]
    ports:
      - "${OSTROM_HTTP_PORT:-80}:80"
      - "${OSTROM_HTTPS_PORT:-443}:443"
    environment:
      OSTROM_SITE_SCHEME: ${OSTROM_SCHEME:-http}
      OSTROM_API_HOST: ${OSTROM_API_HOST:-api.localhost}
      OSTROM_APP_HOST: ${OSTROM_APP_HOST:-app.localhost}
      OSTROM_SSO_HOST: ${OSTROM_SSO_HOST:-sso.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres:
  server-data:
  caddy-data:
  caddy-config:
