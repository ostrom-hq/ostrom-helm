# Ostrom self-hosted, in one command: ./install.sh  (writes .env with fresh secrets, then `docker compose up -d`).
# Hosts default to *.localhost over plain HTTP; set OSTROM_API_HOST / OSTROM_APP_HOST / OSTROM_SSO_HOST to real
# names in .env and Caddy obtains the TLS certificates itself.
name: ostrom

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: docker.io/library/postgres:17.6
    environment:
      POSTGRES_DB: ostrom
      POSTGRES_USER: ostrom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./install.sh first, it writes .env}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ostrom", "-d", "ostrom"]
      interval: 3s
      timeout: 3s
      retries: 40

  server:
    <<: *restart
    image: ${OSTROM_SERVER_IMAGE:-ghcr.io/ostrom-hq/ostrom-server:${OSTROM_VERSION:-latest}}
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      OSTROM_DATABASE_URL: postgresql://postgres:5432/ostrom
      OSTROM_DATABASE_USER: ostrom
      OSTROM_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      OSTROM_SIGNING_KEY_FILE: /var/lib/ostrom/instance-key.pem
      OSTROM_PUBLIC_URL: ${OSTROM_SCHEME:-http}://${OSTROM_API_HOST:-api.localhost}
      OSTROM_API_URL: ${OSTROM_SCHEME:-http}://${OSTROM_API_HOST:-api.localhost}
      OSTROM_APP_URL: ${OSTROM_SCHEME:-http}://${OSTROM_APP_HOST:-app.localhost}
      OSTROM_SAML_POLIS_URL: http://polis:5225
      OSTROM_SAML_POLIS_EXTERNAL_URL: ${OSTROM_SCHEME:-http}://${OSTROM_SSO_HOST:-sso.localhost}
      OSTROM_SAML_POLIS_API_KEY: ${POLIS_API_KEY}
      OSTROM_CLOUD_SESSIONS_ENABLED: "false"
      # BYOK (extraction): openrouter | openai | anthropic | openai-compatible
      OSTROM_EXTRACTION_PROVIDER: ${OSTROM_EXTRACTION_PROVIDER:-}
      OSTROM_EXTRACTION_BASE_URL: ${OSTROM_EXTRACTION_BASE_URL:-}
      OSTROM_EXTRACTION_MODEL: ${OSTROM_EXTRACTION_MODEL:-}
      OSTROM_EXTRACTION_API_KEY: ${OSTROM_EXTRACTION_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    env_file:
      - path: ./server.env
        required: false
    volumes:
      - server-data:/var/lib/ostrom
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    <<: *restart
    image: ${OSTROM_WEB_IMAGE:-ghcr.io/ostrom-hq/ostrom-web:${OSTROM_VERSION:-latest}}
    environment:
      OSTROM_API_URL: ${OSTROM_SCHEME:-http}://${OSTROM_API_HOST:-api.localhost}
      OSTROM_APP_URL: ${OSTROM_SCHEME:-http}://${OSTROM_APP_HOST:-app.localhost}
    read_only: true
    tmpfs: [/tmp, /var/run/ostrom]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  polis:
    <<: *restart
    image: docker.io/boxyhq/jackson:26.2.0
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PORT: "5225"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      EXTERNAL_URL: ${OSTROM_SCHEME:-http}://${OSTROM_SSO_HOST:-sso.localhost}
      NEXTAUTH_URL: ${OSTROM_SCHEME:-http}://${OSTROM_SSO_HOST:-sso.localhost}
      SAML_AUDIENCE: ${POLIS_SAML_AUDIENCE:-https://saml.ostrom.run}
      DB_ENGINE: sql
      DB_TYPE: postgres
      DB_URL: postgres://ostrom:${POSTGRES_PASSWORD}@postgres:5432/polis
      JACKSON_API_KEYS: ${POLIS_API_KEY:?run ./install.sh first}
      NEXTAUTH_SECRET: ${POLIS_NEXTAUTH_SECRET:?run ./install.sh first}
      DB_ENCRYPTION_KEY: ${POLIS_DB_ENCRYPTION_KEY:?run ./install.sh first}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5225/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60

  caddy:
    <<: *restart
    image: docker.io/library/caddy:2.10-alpine
    depends_on: [server, web]
    ports:
      - "${OSTROM_HTTP_PORT:-80}:80"
      - "${OSTROM_HTTPS_PORT:-443}:443"
    environment:
      OSTROM_SITE_SCHEME: ${OSTROM_SCHEME:-http}
      OSTROM_API_HOST: ${OSTROM_API_HOST:-api.localhost}
      OSTROM_APP_HOST: ${OSTROM_APP_HOST:-app.localhost}
      OSTROM_SSO_HOST: ${OSTROM_SSO_HOST:-sso.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres:
  server-data:
  caddy-data:
  caddy-config:
