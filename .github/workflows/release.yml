name: Release chart

# Publishes the chart as a signed OCI artifact when its version changes on main (or on demand).
on:
  push:
    branches: [main]
    paths: [charts/ostrom/Chart.yaml]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-chart
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.17.2 }
      - uses: sigstore/cosign-installer@v3
      - name: Package
        id: pkg
        run: |
          version=$(helm show chart charts/ostrom | awk '/^version:/{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          helm package charts/ostrom -d dist
      - name: Skip if this version is already published
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "chart-v${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Push to GHCR and sign
        if: steps.exists.outputs.published == 'false'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          out=$(helm push "dist/ostrom-${VERSION}.tgz" oci://ghcr.io/ostrom-hq/charts 2>&1); echo "$out"
          digest=$(echo "$out" | awk '/^Digest:/{print $2}')
          echo "${{ github.token }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "ghcr.io/ostrom-hq/charts/ostrom@${digest}"
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false \
            --output-signature "dist/ostrom-${VERSION}.tgz.sig" "dist/ostrom-${VERSION}.tgz"
      - name: GitHub release
        if: steps.exists.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          gh release create "chart-v${VERSION}" "dist/ostrom-${VERSION}.tgz" "dist/ostrom-${VERSION}.tgz.sig" \
            --title "Chart ostrom ${VERSION}" --notes "oci://ghcr.io/ostrom-hq/charts/ostrom --version ${VERSION}"
