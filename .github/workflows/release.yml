name: Release chart

# Publishes the chart as a signed OCI artifact for a version tag (`0.2.0`, bare semver, CONVENTIONS section 12).
# The tag must equal `version` in charts/ostrom/Chart.yaml.
on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-chart
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: { version: v3.17.2 }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: v2.6.5 }
      - name: Package (the tag must be the chart version)
        run: |
          version=$(helm show chart charts/ostrom | awk '/^version:/{print $2}')
          if [ "$version" != "$TAG" ]; then
            echo "::error::tag $TAG but charts/ostrom/Chart.yaml says version $version"; exit 1
          fi
          helm package charts/ostrom -d dist
      - name: Push to Docker Hub and sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        run: |
          echo "$DOCKER_HUB_PASSWORD" | helm registry login registry-1.docker.io -u ostromhq --password-stdin
          out=$(helm push "dist/ostrom-${TAG}.tgz" oci://registry-1.docker.io/ostromhq 2>&1); echo "$out"
          digest=$(echo "$out" | awk '/^Digest:/{print $2}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "helm push printed no digest: $digest" >&2; exit 1; }
          echo "$DOCKER_HUB_PASSWORD" | cosign login registry-1.docker.io -u ostromhq --password-stdin
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "registry-1.docker.io/ostromhq/ostrom@${digest}"
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false \
            --output-signature "dist/ostrom-${TAG}.tgz.sig" "dist/ostrom-${TAG}.tgz"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "dist/ostrom-${TAG}.tgz" "dist/ostrom-${TAG}.tgz.sig" --verify-tag \
            --title "Chart ostrom ${TAG}" --notes "oci://registry-1.docker.io/ostromhq/ostrom --version ${TAG}"
