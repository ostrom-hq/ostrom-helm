suite: bundled PostgreSQL — what a slow query or a lock wait needs to be found (audit CRL-04)
templates:
  - templates/postgresql.yaml
release: { name: o, namespace: ostrom }
tests:
  - it: preloads pg_stat_statements and logs slow statements and lock waits
    documentSelector: { path: kind, value: StatefulSet }
    asserts:
      - contains: { path: 'spec.template.spec.containers[0].args', content: shared_preload_libraries=pg_stat_statements }
      - contains: { path: 'spec.template.spec.containers[0].args', content: pg_stat_statements.track=top }
      - contains: { path: 'spec.template.spec.containers[0].args', content: track_io_timing=on }
      - contains: { path: 'spec.template.spec.containers[0].args', content: log_min_duration_statement=1000 }
      - contains: { path: 'spec.template.spec.containers[0].args', content: log_lock_waits=on }
      - contains: { path: 'spec.template.spec.containers[0].args', content: log_parameter_max_length=0 }
  - it: creates the extension in the postgres database, before the Ostrom database
    documentSelector: { path: kind, value: ConfigMap }
    asserts:
      - matchRegex:
          path: 'data["10-roles.sh"]'
          pattern: 'REVOKE ALL ON DATABASE polis FROM PUBLIC;[\s\S]*CREATE EXTENSION IF NOT EXISTS pg_stat_statements;\s*\\connect :"db"'
  - it: no extension when the library is not preloaded
    documentSelector: { path: kind, value: ConfigMap }
    set: { postgresql.parameters.shared_preload_libraries: "" }
    asserts:
      - notMatchRegex: { path: 'data["10-roles.sh"]', pattern: 'pg_stat_statements' }
  - it: the extension follows the preload list, not a name that only contains it
    documentSelector: { path: kind, value: ConfigMap }
    set: { postgresql.parameters.shared_preload_libraries: "auto_explain, pg_stat_statements" }
    asserts:
      - matchRegex: { path: 'data["10-roles.sh"]', pattern: 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements;' }
  - it: a library named after it is not it
    documentSelector: { path: kind, value: ConfigMap }
    set: { postgresql.parameters.shared_preload_libraries: pg_stat_statements_v2 }
    asserts:
      - notMatchRegex: { path: 'data["10-roles.sh"]', pattern: 'CREATE EXTENSION' }
