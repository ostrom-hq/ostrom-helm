suite: secrets — generated once, kept, never inlined in env
templates:
  - templates/secrets.yaml
tests:
  - it: generates the database password, the instance key, the secrets key and the Polis keys, all kept on uninstall
    set: { polis.enabled: true }
    asserts:
      - hasDocuments: { count: 5 }
      - equal: { path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep }
        documentIndex: 0
      - equal: { path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep }
        documentIndex: 1
      - matchRegex: { path: stringData.password, pattern: "^[A-Za-z0-9]{32}$" }
        documentIndex: 0
      - matchRegex: { path: 'stringData["owner-password"]', pattern: "^[A-Za-z0-9]{32}$" }
        documentIndex: 0
      - matchRegex: { path: 'stringData["postgres-password"]', pattern: "^[A-Za-z0-9]{32}$" }
        documentIndex: 0
      - matchRegex: { path: 'stringData["polis-password"]', pattern: "^[A-Za-z0-9]{32}$" }
        documentIndex: 0
      - isNotEmpty: { path: 'data["instance-key.pem"]' }
        documentIndex: 1
      - equal: { path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep }
        documentIndex: 2
      # base64 of base64 of 32 bytes: 44 characters once decoded, 60 as stored in `data`.
      - matchRegex: { path: 'data["secrets-key"]', pattern: "^[A-Za-z0-9+/]{59}=$" }
        documentIndex: 2
      - matchRegex: { path: 'stringData["db-encryption-key"]', pattern: "^[A-Za-z0-9]{32}$" }
        documentIndex: 4
  - it: puts OTel headers and Langfuse keys into the server Secret
    set:
      observability.otel: { enabled: true, endpoint: https://otlp, headers: "Authorization=Basic x" }
      observability.langfuse: { enabled: true, publicKey: pk, secretKey: sk }
      server.secretEnv: { OSTROM_STRIPE_SECRET_KEY: sk_test_1 }
    documentSelector: { path: metadata.name, value: RELEASE-NAME-ostrom-server }
    asserts:
      - equal: { path: stringData.OTEL_EXPORTER_OTLP_HEADERS, value: "Authorization=Basic x" }
      - equal: { path: stringData.OSTROM_LANGFUSE_SECRET_KEY, value: sk }
      - equal: { path: stringData.OSTROM_STRIPE_SECRET_KEY, value: sk_test_1 }
  - it: puts no telemetry key into the server Secret when telemetry is off
    documentSelector: { path: metadata.name, value: RELEASE-NAME-ostrom-server }
    asserts:
      - notExists: { path: stringData.OTEL_EXPORTER_OTLP_HEADERS }
      - notExists: { path: stringData.OSTROM_LANGFUSE_PUBLIC_KEY }
      - notExists: { path: stringData.OSTROM_LANGFUSE_SECRET_KEY }
  - it: creates nothing for secrets given as existing Secrets
    set:
      postgresql.existingSecret: pg
      server.existingSecret: srv
      server.signingKey.existingSecret: key
      server.secretsKey.existingSecret: sealing
      polis.existingSecret: polis
    asserts:
      - hasDocuments: { count: 0 }
  - it: external database needs a password
    set: { postgresql.enabled: false, externalDatabase.url: "postgresql://db:5432/o", externalDatabase.username: u }
    asserts:
      - failedTemplate: { errorMessage: externalDatabase.password or externalDatabase.existingSecret is required }
  - it: external database needs the owner's password for migrations
    set: { postgresql.enabled: false, externalDatabase.url: "postgresql://db:5432/o", externalDatabase.username: u, externalDatabase.password: p }
    asserts:
      - failedTemplate: { errorMessage: externalDatabase.migrationPassword or externalDatabase.existingSecret is required }
  - it: keeps the secrets key already in the cluster
    release: { name: o, namespace: ostrom }
    kubernetesProvider:
      scheme:
        "v1/Secret": { gvr: { version: v1, resource: secrets }, namespaced: true }
      objects:
        - kind: Secret
          apiVersion: v1
          metadata: { name: o-ostrom-secrets-key, namespace: ostrom }
          data: { secrets-key: a2VwdC1rZXk= }
    documentSelector: { path: metadata.name, value: o-ostrom-secrets-key }
    asserts:
      - equal: { path: 'data["secrets-key"]', value: a2VwdC1rZXk= }
  - it: refuses the secrets key in secretEnv, where the generated one would silently win
    set: { server.secretEnv: { OSTROM_SECRETS_KEY: abc } }
    asserts:
      - failedTemplate: { errorMessage: "server.secretEnv.OSTROM_SECRETS_KEY is not read: put the key in a Secret (key `secrets-key`) and set server.secretsKey.existingSecret" }
  - it: renders without the secretsKey block, as an upgrade with --reuse-values from 0.2.0
    set: { server.secretsKey: null }
    documentSelector: { path: metadata.name, value: RELEASE-NAME-ostrom-secrets-key }
    asserts:
      - isNotEmpty: { path: 'data["secrets-key"]' }
  - it: no Polis Secret by default (Polis is off)
    asserts:
      - hasDocuments: { count: 4 }
      - notEqual: { path: metadata.name, value: RELEASE-NAME-ostrom-polis }
