suite: secrets — generated once, kept, never inlined in env
templates:
  - templates/secrets.yaml
tests:
  - it: generates the database password, the instance key and the Polis keys, all kept on uninstall
    asserts:
      - hasDocuments: { count: 4 }
      - equal: { path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep }
        documentIndex: 0
      - equal: { path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep }
        documentIndex: 1
      - matchRegex: { path: stringData.password, pattern: "^[A-Za-z0-9]{32}$" }
        documentIndex: 0
      - isNotEmpty: { path: 'data["instance-key.pem"]' }
        documentIndex: 1
      - matchRegex: { path: 'stringData["db-encryption-key"]', pattern: "^[A-Za-z0-9]{32}$" }
        documentIndex: 3
  - it: puts BYOK, OTel headers and Langfuse keys into the server Secret
    set:
      byok.extraction: { provider: openrouter, model: m, apiKey: sk-test }
      observability.otel: { enabled: true, endpoint: https://otlp, headers: "Authorization=Basic x" }
      observability.langfuse: { enabled: true, publicKey: pk, secretKey: sk }
      server.secretEnv: { OSTROM_STRIPE_SECRET_KEY: sk_test_1 }
    documentSelector: { path: metadata.name, value: RELEASE-NAME-ostrom-server }
    asserts:
      - equal: { path: stringData.OSTROM_EXTRACTION_API_KEY, value: sk-test }
      - equal: { path: stringData.OTEL_EXPORTER_OTLP_HEADERS, value: "Authorization=Basic x" }
      - equal: { path: stringData.OSTROM_LANGFUSE_SECRET_KEY, value: sk }
      - equal: { path: stringData.OSTROM_STRIPE_SECRET_KEY, value: sk_test_1 }
  - it: creates nothing for secrets given as existing Secrets
    set:
      postgresql.existingSecret: pg
      server.existingSecret: srv
      server.signingKey.existingSecret: key
      polis.existingSecret: polis
    asserts:
      - hasDocuments: { count: 0 }
  - it: external database needs a password
    set: { postgresql.enabled: false, externalDatabase.url: "postgresql://db:5432/o", externalDatabase.username: u }
    asserts:
      - failedTemplate: { errorMessage: externalDatabase.password or externalDatabase.existingSecret is required }
