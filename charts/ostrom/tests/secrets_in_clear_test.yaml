suite: secrets — never in clear outside a Secret (AUDIT-SECU-HELM-2 M4)
templates:
  - templates/secrets.yaml
  - templates/polis.yaml
  - templates/server.yaml
  - templates/server-config.yaml
  - templates/web.yaml
  - templates/site.yaml
release: { name: o, namespace: ostrom }
set:
  postgresql.enabled: false
  externalDatabase: { url: postgresql://db:5432/o, username: u, password: p, migrationUsername: o, migrationPassword: p }
tests:
  - it: Polis reads its external database URL from a Secret, never from the pod spec
    set: { polis.enabled: true, externalDatabase.polisUrl: "postgres://polis:hunter2@db:5432/polis" }
    template: templates/polis.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - contains:
          path: 'spec.template.spec.containers[0].env'
          content: { name: DB_URL, valueFrom: { secretKeyRef: { name: o-ostrom-polis-db, key: url } } }
      - notContains:
          path: 'spec.template.spec.containers[0].env'
          content: { name: DB_URL, value: "postgres://polis:hunter2@db:5432/polis" }
  - it: the chart writes that Secret from polisUrl
    set: { polis.enabled: true, externalDatabase.polisUrl: "postgres://polis:hunter2@db:5432/polis" }
    template: templates/secrets.yaml
    documentSelector: { path: metadata.name, value: o-ostrom-polis-db }
    asserts:
      - isKind: { of: Secret }
      - equal: { path: stringData.url, value: "postgres://polis:hunter2@db:5432/polis" }
  - it: an existing Secret for Polis's database is used as is, and the chart writes none
    set: { polis.enabled: true, externalDatabase.polisExistingSecret: corp-polis-db }
    template: templates/polis.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - contains:
          path: 'spec.template.spec.containers[0].env'
          content: { name: DB_URL, valueFrom: { secretKeyRef: { name: corp-polis-db, key: url } } }
  - it: no Polis database Secret with an existing one
    set: { polis.enabled: true, externalDatabase.polisExistingSecret: corp-polis-db }
    template: templates/secrets.yaml
    asserts:
      # On every document of secrets.yaml: none is the Polis database Secret.
      - notEqual: { path: metadata.name, value: o-ostrom-polis-db }
  - it: the Polis database Secret is there without an existing one (the case above is not vacuous)
    set: { polis.enabled: true, externalDatabase.polisUrl: "postgres://polis:hunter2@db:5432/polis" }
    template: templates/secrets.yaml
    documentSelector: { path: metadata.name, value: o-ostrom-polis-db }
    asserts:
      - isKind: { of: Secret }
  - it: a new Polis database URL rolls the Polis pods, without the URL nor a cheap hash of it in the spec
    set: { polis.enabled: true, externalDatabase.polisUrl: "postgres://polis:hunter2@db:5432/polis" }
    template: templates/polis.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - exists: { path: 'spec.template.metadata.annotations["checksum/polis-db"]' }
      - notMatchRegex: { path: 'spec.template.metadata.annotations["checksum/polis-db"]', pattern: 'hunter2|^[a-f0-9]{16}$' }
  - it: Polis on an external database still needs its URL
    set: { polis.enabled: true }
    template: templates/secrets.yaml
    asserts:
      - failedTemplate: { errorMessage: externalDatabase.polisUrl or polisExistingSecret is required when polis.enabled and postgresql.enabled is false }
  - it: refuses a secret in server.config (a ConfigMap)
    set: { server.config: { OSTROM_STRIPE_SECRET_KEY: sk_live_x } }
    template: templates/server.yaml  # its checksum renders server-config.yaml first
    asserts:
      - failedTemplate: { errorPattern: 'server.config.OSTROM_STRIPE_SECRET_KEY looks like a secret' }
  - it: refuses a token, a password, an API key or a key in server.config
    set: { server.config: { OSTROM_MCP_HOST_TOKEN: x } }
    template: templates/server.yaml  # its checksum renders server-config.yaml first
    asserts:
      - failedTemplate: { errorPattern: 'OSTROM_MCP_HOST_TOKEN looks like a secret' }
  - it: refuses a name ending in _KEY
    set: { server.config: { OSTROM_LICENSE_KEY: x } }
    template: templates/server.yaml  # its checksum renders server-config.yaml first
    asserts:
      - failedTemplate: { errorPattern: 'OSTROM_LICENSE_KEY looks like a secret' }
  - it: accepts paths, addresses, pull Secret names and PostHog's public key
    set:
      server.config:
        OSTROM_LICENSE_KEY_FILE: /etc/ostrom/license
        OSTROM_GOOGLE_TOKEN_URL: https://oauth2.example.com/token
        OSTROM_RUNNERS_KUBERNETES_IMAGE_PULL_SECRET: ghcr
        OSTROM_POSTHOG_API_KEY: phc_public
        OSTROM_MCP_ALLOW_PRIVATE_UPSTREAMS: "false"
    template: templates/server-config.yaml
    asserts:
      - equal: { path: data.OSTROM_LICENSE_KEY_FILE, value: /etc/ostrom/license }
      - equal: { path: data.OSTROM_MCP_ALLOW_PRIVATE_UPSTREAMS, value: "false" }
  - it: refuses a plain extraEnv value with a secret name, accepts the same name from a Secret
    set:
      server.extraEnv:
        - { name: OSTROM_RESEND_API_KEY, value: re_x }
    template: templates/server.yaml  # its checksum renders server-config.yaml first
    asserts:
      - failedTemplate: { errorPattern: 'server.extraEnv.OSTROM_RESEND_API_KEY looks like a secret' }
  - it: accepts an extraEnv secret from a secretKeyRef
    set:
      server.extraEnv:
        - { name: OSTROM_RESEND_API_KEY, valueFrom: { secretKeyRef: { name: corp, key: resend } } }
    template: templates/server.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - contains:
          path: 'spec.template.spec.containers[0].env'
          content: { name: OSTROM_RESEND_API_KEY, valueFrom: { secretKeyRef: { name: corp, key: resend } } }
  - it: refuses a secret in web.config, which every browser reads
    set: { web.config: { GITHUB_TOKEN: ghp_x } }
    template: templates/web.yaml
    asserts:
      - failedTemplate: { errorPattern: 'web.config.GITHUB_TOKEN looks like a secret, and it is served to every browser' }
  - it: refuses a secret in site.env
    set: { site.env: { SOME_PASSWORD: x } }
    template: templates/site.yaml
    asserts:
      - failedTemplate: { errorPattern: 'site.env.SOME_PASSWORD looks like a secret' }
  - it: refuses every secret-looking family in server.config
    template: templates/server.yaml
    set: { server.config: { OSTROM_SMTP_PASSWORD: x } }
    asserts:
      - failedTemplate: { errorPattern: 'OSTROM_SMTP_PASSWORD looks like a secret' }
  - it: refuses PASSWD
    template: templates/server.yaml
    set: { server.config: { OSTROM_DB_PASSWD: x } }
    asserts:
      - failedTemplate: { errorPattern: 'OSTROM_DB_PASSWD looks like a secret' }
  - it: refuses CREDENTIAL
    template: templates/server.yaml
    set: { server.config: { GOOGLE_APPLICATION_CREDENTIALS_JSON: x } }
    asserts:
      - failedTemplate: { errorPattern: 'GOOGLE_APPLICATION_CREDENTIALS_JSON looks like a secret' }
  - it: refuses PRIVATE_KEY and API_KEY
    template: templates/server.yaml
    set: { server.config: { OSTROM_RESEND_API_KEY: x } }
    asserts:
      - failedTemplate: { errorPattern: 'OSTROM_RESEND_API_KEY looks like a secret' }
  - it: refuses a private key in extraEnv
    template: templates/server.yaml
    set: { server.extraEnv: [{ name: SIGNING_PRIVATE_KEY_PEM, value: x }] }
    asserts:
      - failedTemplate: { errorPattern: 'server.extraEnv.SIGNING_PRIVATE_KEY_PEM looks like a secret' }
  - it: an address is exempt by name, never by content (a password in the URL)
    template: templates/server.yaml
    set: { server.config: { OSTROM_REDIS_URL: "redis://:s3cr3t@redis:6379" } }
    asserts:
      - failedTemplate: { errorPattern: 'server.config.OSTROM_REDIS_URL holds a credential' }
  - it: a token in a query string is a credential too
    template: templates/server.yaml
    set: { server.extraEnv: [{ name: HOOK_ENDPOINT, value: "https://hooks.example.com/x?token=abc" }] }
    asserts:
      - failedTemplate: { errorPattern: 'server.extraEnv.HOOK_ENDPOINT holds a credential' }
  - it: web.config refuses a credential URL
    template: templates/web.yaml
    set: { web.config: { statusPage: "https://u:p@status.example.com" } }
    asserts:
      - failedTemplate: { errorPattern: 'web.config.statusPage holds a credential' }
  - it: externalDatabase.url never carries the password
    template: templates/server.yaml
    set:
      postgresql.enabled: false
      externalDatabase: { url: "postgresql://u:pw@db:5432/o", username: u, password: p, migrationUsername: o, migrationPassword: p }
    asserts:
      - failedTemplate: { errorPattern: 'externalDatabase.url holds a credential' }
  - it: only the runners' pull Secret name is exempt, not any _PULL_SECRET
    template: templates/server.yaml
    set: { server.config: { OSTROM_REGISTRY_PULL_SECRET: x } }
    asserts:
      - failedTemplate: { errorPattern: 'OSTROM_REGISTRY_PULL_SECRET looks like a secret' }
