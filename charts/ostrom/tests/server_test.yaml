suite: server — configuration, images, migrations, probes
templates:
  - templates/server.yaml
  - templates/server-config.yaml
release: { name: o, namespace: ostrom }
tests:
  - it: wires the database (serving role) and the URLs into the ConfigMap; no cloud sessions by default
    template: templates/server-config.yaml
    set: { global.urls.api: "https://api.ostrom.run", global.urls.app: "https://app.ostrom.run" }
    asserts:
      - equal: { path: data.OSTROM_DATABASE_URL, value: "postgresql://o-ostrom-postgresql:5432/ostrom" }
      - equal: { path: data.OSTROM_DATABASE_USER, value: ostrom_app }
      - equal: { path: data.OSTROM_PUBLIC_URL, value: "https://api.ostrom.run" }
      - equal: { path: data.OSTROM_CONSOLE_URL, value: "https://app.ostrom.run" }
      - notExists: { path: data.OSTROM_RUNNERS_DRIVER }
      - notExists: { path: data.OSTROM_RUNNERS_ALLOWED_ORGS }
  - it: sets only variables the server of main reads (no API/app/site URL, extraction, Polis or session cap keys)
    template: templates/server-config.yaml
    set: { cloudSessions.enabled: true, server.replicas: 1 }
    asserts:
      - notExists: { path: data.OSTROM_API_URL }
      - notExists: { path: data.OSTROM_APP_URL }
      - notExists: { path: data.OSTROM_SITE_URL }
      - notExists: { path: data.OSTROM_EXTRACTION_PROVIDER }
      - notExists: { path: data.OSTROM_SAML_POLIS_URL }
      - notExists: { path: data.OSTROM_SAML_POLIS_EXTERNAL_URL }
      - notExists: { path: data.OSTROM_CLOUD_MAX_CONCURRENT }
  - it: no Polis or extraction key in the server's environment
    template: templates/server.yaml
    asserts:
      - notContains: { path: 'spec.template.spec.containers[0].env', content: { name: OSTROM_SAML_POLIS_API_KEY }, any: true }
      - notContains: { path: 'spec.template.spec.containers[0].env', content: { name: OSTROM_EXTRACTION_API_KEY }, any: true }
  - it: cloud sessions with no allowed organization set an empty list, an explicit refusal (S2-10)
    template: templates/server-config.yaml
    set: { cloudSessions.enabled: true, server.replicas: 1 }
    asserts:
      - equal: { path: data.OSTROM_RUNNERS_ALLOWED_ORGS, value: "" }
  - it: cloud sessions open to the listed organizations
    template: templates/server-config.yaml
    set:
      cloudSessions: { enabled: true, allowedOrgs: [0192f6a1-7c3e-7d4a-9b2f-1a2b3c4d5e6f, 0192f6a1-7c3e-7d4a-9b2f-1a2b3c4d5e70] }
      server.replicas: 1
    asserts:
      - equal: { path: data.OSTROM_RUNNERS_ALLOWED_ORGS, value: "0192f6a1-7c3e-7d4a-9b2f-1a2b3c4d5e6f,0192f6a1-7c3e-7d4a-9b2f-1a2b3c4d5e70" }
  - it: cloud sessions open to all with "*"
    template: templates/server-config.yaml
    set: { cloudSessions: { enabled: true, allowedOrgs: ["*"] }, server.replicas: 1 }
    asserts:
      - equal: { path: data.OSTROM_RUNNERS_ALLOWED_ORGS, value: "*" }
  - it: refuses an allowed organization that is not an id
    template: templates/server.yaml
    set: { cloudSessions: { enabled: true, allowedOrgs: [acme] }, server.replicas: 1 }
    asserts:
      - failedTemplate: { errorMessage: 'cloudSessions.allowedOrgs lists organization ids (UUID) or "*", not acme' }
  - it: cloud sessions use the Kubernetes driver in the release namespace
    template: templates/server-config.yaml
    set: { cloudSessions.enabled: true, server.replicas: 1, global.imagePullSecrets: [ghcr], cloudSessions.runner.priorityClassName: low }
    asserts:
      - equal: { path: data.OSTROM_RUNNERS_DRIVER, value: kubernetes }
      - equal: { path: data.OSTROM_RUNNERS_SERVER_URL, value: "http://o-ostrom-server.ostrom.svc:8080" }
      - equal: { path: data.OSTROM_RUNNERS_IMAGE, value: "ghcr.io/ostrom-hq/ostrom-runner:0.1.0" }
      - equal: { path: data.OSTROM_RUNNERS_KUBERNETES_NAMESPACE, value: ostrom }
      - equal: { path: data.OSTROM_RUNNERS_KUBERNETES_IMAGE_PULL_SECRET, value: ghcr }
      - equal: { path: data.OSTROM_RUNNERS_KUBERNETES_PRIORITY_CLASS, value: low }
      - equal: { path: data.OSTROM_RUNNERS_WORKSPACE_SIZE, value: 10Gi }
      - equal: { path: data.OSTROM_RUNNERS_KUBERNETES_SERVER_SELECTOR, value: "app.kubernetes.io/name=ostrom,app.kubernetes.io/instance=o,app.kubernetes.io/component=server" }
  - it: cloud sessions refuse more than one server replica
    template: templates/server.yaml
    set: { cloudSessions.enabled: true, server.replicas: 2 }
    asserts:
      - failedTemplate: { errorMessage: "cloudSessions.enabled needs exactly one server replica (server.replicas: 1, no autoscaling): the terminal relay lives in memory" }
  - it: OTel settings land in the ConfigMap when set
    template: templates/server-config.yaml
    set:
      observability.otel:
        { enabled: true, endpoint: "https://otlp", resourceAttributes: "deployment.environment.name=prod", tracesSampleRatio: "0.25" }
    asserts:
      - equal: { path: data.OTEL_EXPORTER_OTLP_ENDPOINT, value: "https://otlp" }
      - equal: { path: data.OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
      - equal: { path: data.OTEL_SERVICE_NAME, value: ostrom-server }
      - equal: { path: data.OTEL_RESOURCE_ATTRIBUTES, value: "deployment.environment.name=prod" }
      - equal: { path: data.OTEL_TRACES_SAMPLER_ARG, value: "0.25" }
  - it: a sampling ratio of 0 is kept
    template: templates/server-config.yaml
    set: { observability.otel: { enabled: true, endpoint: "https://otlp", tracesSampleRatio: 0 } }
    asserts:
      - equal: { path: data.OTEL_TRACES_SAMPLER_ARG, value: "0" }
  - it: an unset sampling ratio leaves the server's default
    template: templates/server-config.yaml
    set: { observability.otel: { enabled: true, endpoint: "https://otlp" } }
    asserts:
      - notExists: { path: data.OTEL_TRACES_SAMPLER_ARG }
  - it: a sampling ratio outside 0 to 1 stops the install
    template: templates/server.yaml
    set: { observability.otel: { enabled: true, endpoint: "https://otlp", tracesSampleRatio: 25 } }
    asserts:
      - failedTemplate: { errorMessage: "observability.otel.tracesSampleRatio must be between 0 and 1, got 25" }
  - it: nothing is exported when OTel, Langfuse and PostHog are off (self-hosted default)
    template: templates/server-config.yaml
    asserts:
      - notExists: { path: data.OTEL_EXPORTER_OTLP_ENDPOINT }
      - notExists: { path: data.OTEL_EXPORTER_OTLP_PROTOCOL }
      - notExists: { path: data.OTEL_SERVICE_NAME }
      - notExists: { path: data.OTEL_RESOURCE_ATTRIBUTES }
      - notExists: { path: data.OTEL_TRACES_SAMPLER_ARG }
      - notExists: { path: data.OSTROM_POSTHOG_API_KEY }
      - notExists: { path: data.OSTROM_LANGFUSE_HOST }
  - it: a digest pins the image
    template: templates/server.yaml
    documentSelector: { path: kind, value: Deployment }
    set: { server.image.digest: "sha256:abc" }
    asserts:
      - equal: { path: 'spec.template.spec.containers[0].image', value: "ghcr.io/ostrom-hq/ostrom-server@sha256:abc" }
  - it: global tag and registry apply
    template: templates/server.yaml
    documentSelector: { path: kind, value: Deployment }
    set: { global.imageTag: "1.2.3", global.imageRegistry: "registry.local/o", global.imagePullSecrets: [ghcr] }
    asserts:
      - equal: { path: 'spec.template.spec.containers[0].image', value: "registry.local/o/ostrom-server:1.2.3" }
      - equal: { path: 'spec.template.spec.imagePullSecrets[0].name', value: ghcr }
  - it: migrations run first, with the owner's credentials, which the serving container never receives
    template: templates/server.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - equal: { path: 'spec.template.spec.initContainers[0].command', value: ["/usr/local/bin/ostrom-server", "migrate"] }
      - contains:
          path: 'spec.template.spec.initContainers[0].env'
          content: { name: OSTROM_DATABASE_MIGRATION_USER, value: ostrom }
      - contains:
          path: 'spec.template.spec.initContainers[0].env'
          content:
            name: OSTROM_DATABASE_MIGRATION_PASSWORD
            valueFrom: { secretKeyRef: { name: o-ostrom-postgresql, key: owner-password } }
      - contains:
          path: 'spec.template.spec.initContainers[0].env'
          content:
            name: OSTROM_DATABASE_MIGRATION_URL
            value: "postgresql://$(OSTROM_DATABASE_MIGRATION_USER):$(OSTROM_DATABASE_MIGRATION_PASSWORD)@o-ostrom-postgresql:5432/ostrom"
      - notContains:
          path: 'spec.template.spec.containers[0].env'
          content:
            name: OSTROM_DATABASE_MIGRATION_PASSWORD
            valueFrom: { secretKeyRef: { name: o-ostrom-postgresql, key: owner-password } }
      - contains:
          path: 'spec.template.spec.containers[0].env'
          content:
            name: OSTROM_DATABASE_PASSWORD
            valueFrom: { secretKeyRef: { name: o-ostrom-postgresql, key: password } }
  - it: an external database takes the migration credentials from its own secret
    template: templates/server.yaml
    documentSelector: { path: kind, value: Deployment }
    set:
      postgresql.enabled: false
      externalDatabase: { url: "postgresql://db.example:5432/ostrom", username: app, migrationUsername: owner, existingSecret: db }
    asserts:
      - contains:
          path: 'spec.template.spec.initContainers[0].env'
          content:
            name: OSTROM_DATABASE_MIGRATION_URL
            value: "postgresql://$(OSTROM_DATABASE_MIGRATION_USER):$(OSTROM_DATABASE_MIGRATION_PASSWORD)@db.example:5432/ostrom"
      - contains:
          path: 'spec.template.spec.initContainers[0].env'
          content:
            name: OSTROM_DATABASE_MIGRATION_PASSWORD
            valueFrom: { secretKeyRef: { name: db, key: migration-password } }
  - it: migrations can be turned off
    template: templates/server.yaml
    documentSelector: { path: kind, value: Deployment }
    set: { migrations.initContainer: false }
    asserts:
      - notExists: { path: spec.template.spec.initContainers }
  - it: no replicas field under an autoscaler, rolling update without downtime
    template: templates/server.yaml
    documentSelector: { path: kind, value: Deployment }
    set: { server.autoscaling.enabled: true }
    asserts:
      - notExists: { path: spec.replicas }
      - equal: { path: spec.strategy.rollingUpdate.maxUnavailable, value: 0 }
  - it: the signing key is mounted read-only
    template: templates/server.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: signing-key, mountPath: /var/run/ostrom/signing, readOnly: true }
  - it: the server user can read the signing key (fsGroup, group-readable mode)
    template: templates/server.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - equal: { path: spec.template.spec.securityContext.fsGroup, value: 65532 }
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
      - equal: { path: 'spec.template.spec.volumes[0].secret.defaultMode', value: 0440 }
  - it: every replica reads the same secrets key from its Secret (SECURITY-AUDIT S2-11)
    template: templates/server.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OSTROM_SECRETS_KEY
            valueFrom: { secretKeyRef: { name: o-ostrom-secrets-key, key: secrets-key } }
  - it: an existing Secret replaces the generated secrets key
    template: templates/server.yaml
    documentSelector: { path: kind, value: Deployment }
    set: { server.secretsKey.existingSecret: sealing }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OSTROM_SECRETS_KEY
            valueFrom: { secretKeyRef: { name: sealing, key: secrets-key } }
  - it: the server requests 160 Mi (129-138 MiB measured under load) and is limited to 256 Mi
    template: templates/server.yaml
    asserts:
      - equal: { path: 'spec.template.spec.containers[0].resources', value: { requests: { cpu: 100m, memory: 160Mi }, limits: { memory: 256Mi } } }
        documentIndex: 2
