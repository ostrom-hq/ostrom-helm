suite: security — nothing cluster-wide, least privilege
templates:
  - templates/cloud-sessions.yaml
  - templates/server.yaml
  - templates/server-config.yaml
  - templates/web.yaml
  - templates/site.yaml
  - templates/polis.yaml
  - templates/postgresql.yaml
  - templates/tests/test-database.yaml
tests:
  - it: the session controller gets a namespaced Role, never a ClusterRole
    template: templates/cloud-sessions.yaml
    release: { name: o, namespace: ostrom }
    set: { cloudSessions.enabled: true, server.replicas: 1 }
    asserts:
      - hasDocuments: { count: 2 }
      - isKind: { of: Role }
        documentIndex: 0
      - notContains: { path: 'rules[*].resources', content: [nodes] }
        documentIndex: 0
      - notContains: { path: 'rules[*].resources', content: [pods/exec] }
        documentIndex: 0
      - contains: { path: rules, content: { apiGroups: [networking.k8s.io], resources: [networkpolicies], verbs: [get, create, update] } }
        documentIndex: 0
      - equal: { path: 'subjects[0].namespace', value: ostrom }
        documentIndex: 1
      - equal: { path: roleRef.kind, value: Role }
        documentIndex: 1
  - it: the session controller lists the workspace claims, for the garbage collection
    template: templates/cloud-sessions.yaml
    set: { cloudSessions.enabled: true, server.replicas: 1 }
    asserts:
      - contains: { path: rules, content: { apiGroups: [""], resources: [persistentvolumeclaims], verbs: [get, list, create, delete] } }
        documentIndex: 0
  - it: the opt-in volume reader only reads PersistentVolumes and StorageClasses, cluster-wide
    template: templates/cloud-sessions.yaml
    release: { name: o, namespace: ostrom }
    set: { cloudSessions.enabled: true, server.replicas: 1, cloudSessions.rbac.volumeReader: true }
    asserts:
      - hasDocuments: { count: 4 }
      - isKind: { of: ClusterRole }
        documentIndex: 2
      - equal:
          path: rules
          value:
            - { apiGroups: [""], resources: [persistentvolumes], verbs: [get, list] }
            - { apiGroups: [storage.k8s.io], resources: [storageclasses], verbs: [get, list] }
        documentIndex: 2
      - equal: { path: metadata.name, value: o-ostrom-ostrom-volume-reader }
        documentIndex: 2
      - isKind: { of: ClusterRoleBinding }
        documentIndex: 3
      - equal: { path: 'subjects[0].namespace', value: ostrom }
        documentIndex: 3
  - it: no volume reader when RBAC creation is off, even asked for
    template: templates/cloud-sessions.yaml
    set: { cloudSessions.enabled: true, server.replicas: 1, cloudSessions.rbac.create: false, cloudSessions.rbac.volumeReader: true }
    asserts:
      - hasDocuments: { count: 0 }
  - it: no Role when RBAC creation is off
    template: templates/cloud-sessions.yaml
    set: { cloudSessions.enabled: true, server.replicas: 1, cloudSessions.rbac.create: false }
    asserts:
      - hasDocuments: { count: 0 }
  - it: no cloud-session objects when the feature is off, and the server gets no API token
    set: { cloudSessions.enabled: false }
    template: templates/cloud-sessions.yaml
    asserts:
      - hasDocuments: { count: 0 }
  - it: the server ServiceAccount token is mounted only for cloud sessions
    template: templates/server.yaml
    set: { cloudSessions.enabled: false }
    asserts:
      - equal: { path: automountServiceAccountToken, value: false }
        documentIndex: 0
  - it: every container drops all capabilities and runs read-only
    template: templates/server.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - equal: { path: 'spec.template.spec.containers[0].securityContext.capabilities.drop', value: [ALL] }
      - equal: { path: 'spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem', value: true }
      - equal: { path: 'spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation', value: false }
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
  - it: web and site do not mount a service account token
    template: templates/web.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - equal: { path: spec.template.spec.automountServiceAccountToken, value: false }
  - it: postgres runs as the postgres user, not root
    template: templates/postgresql.yaml
    documentSelector: { path: kind, value: StatefulSet }
    asserts:
      - equal: { path: spec.template.spec.securityContext.runAsUser, value: 999 }
      - equal: { path: 'spec.template.spec.containers[0].securityContext.capabilities.drop', value: [ALL] }
  - it: helm test checks the database roles with the serving and owner credentials
    template: templates/tests/test-database.yaml
    release: { name: o, namespace: ostrom }
    asserts:
      - isKind: { of: Pod }
      - equal: { path: 'metadata.annotations["helm.sh/hook"]', value: test }
      - matchRegex: { path: 'spec.containers[0].args[0]', pattern: "rolsuper OR rolbypassrls" }
      - matchRegex: { path: 'spec.containers[0].args[0]', pattern: "has_table_privilege\\(current_user, oid, 'INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER'\\) OR has_any_column_privilege\\(current_user, oid, 'INSERT, UPDATE, REFERENCES'\\)" }
      - matchRegex: { path: 'spec.containers[0].args[0]', pattern: "relnamespace = 'public'::regnamespace AND relname LIKE 'flyway\\\\_%'" }
      - matchRegex: { path: 'spec.containers[0].args[0]', pattern: "can write \\$writable of the migrations' histories" }
      - contains:
          path: spec.containers[0].env
          content: { name: OWNER_PASSWORD, valueFrom: { secretKeyRef: { name: o-ostrom-postgresql, key: owner-password } } }
  - it: the database starts with three roles, the serving one without privileges
    template: templates/postgresql.yaml
    documentSelector: { path: kind, value: ConfigMap }
    asserts:
      - matchRegex: { path: 'data["10-roles.sh"]', pattern: 'CREATE ROLE :"app" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS' }
      - matchRegex: { path: 'data["10-roles.sh"]', pattern: 'CREATE DATABASE :"db" OWNER :"owner"' }
      - matchRegex: { path: 'data["10-roles.sh"]', pattern: 'REVOKE ALL ON DATABASE polis FROM PUBLIC' }
