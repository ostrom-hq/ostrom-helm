suite: availability — HPA, PDB, spread over nodes
templates:
  - templates/availability.yaml
  - templates/server.yaml
  - templates/server-config.yaml
  - templates/web.yaml
  - templates/site.yaml
release: { name: o, namespace: ostrom }
tests:
  - it: by default, a PDB per component with two replicas and no HPA
    template: templates/availability.yaml
    asserts:
      - hasDocuments: { count: 3 }
      - isKind: { of: PodDisruptionBudget }
      - equal: { path: spec.minAvailable, value: 1 }
  - it: with the server's HPA, scale-down is slow and the Deployment leaves replicas to the HPA
    set: { server.autoscaling.enabled: true, web.enabled: false, site.enabled: false }
    asserts:
      - template: templates/availability.yaml
        documentIndex: 0
        isKind: { of: HorizontalPodAutoscaler }
      - template: templates/availability.yaml
        documentIndex: 0
        equal: { path: spec.behavior.scaleDown.stabilizationWindowSeconds, value: 300 }
      - template: templates/availability.yaml
        documentIndex: 0
        equal: { path: "spec.behavior.scaleDown.policies[0]", value: { type: Pods, value: 1, periodSeconds: 60 } }
      - template: templates/server.yaml
        documentSelector: { path: kind, value: Deployment }
        notExists: { path: spec.replicas }
  - it: no PDB when an HPA may scale down to one pod (it would block every node drain)
    set: { server.autoscaling.enabled: true, server.autoscaling.minReplicas: 1, web.enabled: false, site.enabled: false }
    template: templates/availability.yaml
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: HorizontalPodAutoscaler }
  - it: no PDB for a single replica
    set: { server.replicas: 1, web.enabled: false, site.enabled: false }
    template: templates/availability.yaml
    asserts:
      - hasDocuments: { count: 0 }
  - it: refuses a PDB that would forbid any eviction
    set: { server.podDisruptionBudget.minAvailable: 2 }
    template: templates/availability.yaml
    asserts:
      - failedTemplate:
          errorMessage: "server.podDisruptionBudget.minAvailable (2) must be below its fewest replicas (2), or no node could be drained"
  - it: web and site spread over nodes by default, like the server
    asserts:
      - template: templates/web.yaml
        documentSelector: { path: kind, value: Deployment }
        equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchLabels["app.kubernetes.io/component"]
          value: web
      - template: templates/site.yaml
        documentSelector: { path: kind, value: Deployment }
        equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: kubernetes.io/hostname
      - template: templates/server.yaml
        documentSelector: { path: kind, value: Deployment }
        equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchLabels["app.kubernetes.io/component"]
          value: server
  - it: an affinity given in the values replaces the default
    set:
      web.affinity: { nodeAffinity: { requiredDuringSchedulingIgnoredDuringExecution: { nodeSelectorTerms: [{ matchExpressions: [{ key: pool, operator: In, values: [web] }] }] } } }
    template: templates/web.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - notExists: { path: spec.template.spec.affinity.podAntiAffinity }
      - exists: { path: spec.template.spec.affinity.nodeAffinity }
