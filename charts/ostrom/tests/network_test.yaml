suite: network — deny by default, runners cut from the cluster
templates:
  - templates/networkpolicy.yaml
release: { name: o, namespace: ostrom }
tests:
  - it: denies all traffic of the release by default
    documentSelector: { path: metadata.name, value: o-ostrom-default-deny }
    asserts:
      - equal: { path: spec.policyTypes, value: [Ingress, Egress] }
      - equal: { path: 'spec.podSelector.matchLabels["app.kubernetes.io/instance"]', value: o }
  - it: session pods reach DNS, the server and the internet, no private range, metadata endpoint or extra CIDR
    set: { cloudSessions.enabled: true, server.replicas: 1, networkPolicy.egress.extraDeniedCidrs: [203.0.113.7/32] }
    documentSelector: { path: metadata.name, value: o-ostrom-sessions }
    asserts:
      - equal: { path: 'spec.podSelector.matchLabels["app.kubernetes.io/managed-by"]', value: ostrom }
      - equal: { path: spec.ingress, value: [] }
      - equal: { path: 'spec.egress[1].ports[0].port', value: 8080 }
      - contains: { path: 'spec.egress[2].to[0].ipBlock.except', content: 169.254.0.0/16 }
      - contains: { path: 'spec.egress[2].to[0].ipBlock.except', content: 10.0.0.0/8 }
      - contains: { path: 'spec.egress[2].to[0].ipBlock.except', content: 203.0.113.7/32 }
  - it: the server accepts the session pods only when cloud sessions are on
    set: { cloudSessions.enabled: true, server.replicas: 1 }
    documentSelector: { path: metadata.name, value: o-ostrom-server-from-ingress }
    asserts:
      - contains:
          path: 'spec.ingress[0].from'
          content:
            podSelector:
              matchLabels: { app.kubernetes.io/managed-by: ostrom }
              matchExpressions: [{ key: ostrom.run/session, operator: Exists }]
  - it: no session policy by default
    asserts:
      - notExists: { path: 'metadata.name' }
    documentSelector: { path: metadata.name, value: o-ostrom-sessions, skipEmptyTemplates: true }
  - it: the Cilium deny keeps every pod of the namespace off the extra CIDRs and the metadata service
    set: { networkPolicy.ciliumEgressDeny.enabled: true, networkPolicy.egress.extraDeniedCidrs: [203.0.113.7/32] }
    documentSelector: { path: metadata.name, value: o-ostrom-egress-deny }
    asserts:
      - equal: { path: spec.endpointSelector, value: {} }
      - equal: { path: spec.enableDefaultDeny, value: { egress: false, ingress: false } }
      - contains: { path: 'spec.egressDeny[0].toCIDRSet', content: { cidr: 169.254.169.254/32 } }
      - contains: { path: 'spec.egressDeny[0].toCIDRSet', content: { cidr: 203.0.113.7/32 } }
  - it: the Cilium deny also covers the pods of other namespaces (cluster DNS excepted) and the nodes
    release: { namespace: ostrom }
    set: { networkPolicy.ciliumEgressDeny.enabled: true }
    documentSelector: { path: metadata.name, value: o-ostrom-egress-deny }
    asserts:
      - equal:
          path: 'spec.egressDeny[1].toEndpoints[0].matchExpressions'
          value:
            - { key: 'k8s:io.kubernetes.pod.namespace', operator: Exists }
            - { key: 'k8s:io.kubernetes.pod.namespace', operator: NotIn, values: [ostrom, kube-system] }
      - equal: { path: 'spec.egressDeny[1].toEndpoints[1].matchLabels', value: { 'k8s:io.kubernetes.pod.namespace': kube-system } }
      - equal:
          path: 'spec.egressDeny[1].toEndpoints[1].matchExpressions[0]'
          value: { key: 'k8s:k8s-app', operator: NotIn, values: [kube-dns, coredns] }
      - equal: { path: 'spec.egressDeny[2].toEntities', value: [host, remote-node] }
  - it: the node deny can be turned off, the namespace deny too
    set:
      networkPolicy.ciliumEgressDeny.enabled: true
      networkPolicy.ciliumEgressDeny.otherNamespaces.denyNodes: false
    documentSelector: { path: metadata.name, value: o-ostrom-egress-deny }
    asserts:
      - lengthEqual: { path: spec.egressDeny, count: 2 }
  - it: without the namespace deny, only the CIDRs
    set:
      networkPolicy.ciliumEgressDeny.enabled: true
      networkPolicy.ciliumEgressDeny.otherNamespaces.enabled: false
    documentSelector: { path: metadata.name, value: o-ostrom-egress-deny }
    asserts:
      - lengthEqual: { path: spec.egressDeny, count: 1 }
  - it: only the server, Polis, the backup job and the helm test reach PostgreSQL
    documentSelector: { path: metadata.name, value: o-ostrom-postgresql }
    asserts:
      - lengthEqual: { path: 'spec.ingress[0].from', count: 4 }
  - it: without helm tests, only the server, Polis and the backup job reach PostgreSQL
    set: { tests.enabled: false }
    documentSelector: { path: metadata.name, value: o-ostrom-postgresql }
    asserts:
      - lengthEqual: { path: 'spec.ingress[0].from', count: 3 }
  - it: the Cilium policy for the API server is opt-in
    set: { networkPolicy.kubeApi.cilium: true, cloudSessions.enabled: true, server.replicas: 1 }
    documentSelector: { path: kind, value: CiliumNetworkPolicy }
    asserts:
      - equal: { path: 'spec.egress[0].toEntities', value: [kube-apiserver] }
  - it: renders nothing when disabled
    set: { networkPolicy.enabled: false }
    asserts:
      - hasDocuments: { count: 0 }
  - it: the console reaches the server (it proxies /api/), and the server accepts it
    documentSelector: { path: metadata.name, value: o-ostrom-web-egress }
    asserts:
      - equal: { path: 'spec.egress[0].to[0].podSelector.matchLabels["app.kubernetes.io/component"]', value: server }
  - it: the server reaches the internet minus the denied ranges by default, then its MCP host
    documentSelector: { path: metadata.name, value: o-ostrom-server-egress }
    asserts:
      # PostgreSQL, the internet, the MCP host (mcp_host_test.yaml).
      - lengthEqual: { path: spec.egress, count: 3 }
      - equal: { path: 'spec.egress[1].to[0].ipBlock.cidr', value: 0.0.0.0/0 }
  - it: without the internet, the server keeps PostgreSQL and the rules it declares
    set:
      networkPolicy.server.allowInternet: false
      networkPolicy.server.extraEgress:
        - to: [{ ipBlock: { cidr: 10.20.0.15/32 } }]
          ports: [{ protocol: TCP, port: 3128 }]
    documentSelector: { path: metadata.name, value: o-ostrom-server-egress }
    asserts:
      # PostgreSQL, the declared rule, the MCP host.
      - lengthEqual: { path: spec.egress, count: 3 }
      - equal: { path: 'spec.egress[0].ports[0].port', value: 5432 }
      - equal:
          path: 'spec.egress[1]'
          value: { to: [{ ipBlock: { cidr: 10.20.0.15/32 } }], ports: [{ protocol: TCP, port: 3128 }] }
      - notContains: { path: spec.egress, content: { to: [{ ipBlock: { cidr: 0.0.0.0/0 } }] }, any: true }
  - it: an external database on a private range is one rule, the private ranges stay denied
    set:
      postgresql.enabled: false
      externalDatabase: { url: postgresql://10.20.0.15:5432/ostrom, username: u, password: p, migrationUsername: o, migrationPassword: p }
      networkPolicy.server.extraEgress:
        - to: [{ ipBlock: { cidr: 10.20.0.15/32 } }]
          ports: [{ protocol: TCP, port: 5432 }]
    documentSelector: { path: metadata.name, value: o-ostrom-server-egress }
    asserts:
      - equal: { path: 'spec.egress[0].to[0].ipBlock.cidr', value: 10.20.0.15/32 }
      - contains: { path: 'spec.egress[1].to[0].ipBlock.except', content: 10.0.0.0/8 }
  - it: refuses an extra egress rule without a destination (it would allow everything)
    set:
      networkPolicy.server.extraEgress: [{ ports: [{ protocol: TCP, port: 5432 }] }]
    asserts:
      - failedTemplate:
          errorPattern: "networkPolicy.server.extraEgress\\[0\\] needs `to` and `ports`"
  - it: refuses an extra egress rule without ports
    set:
      networkPolicy.server.extraEgress: [{ to: [{ ipBlock: { cidr: 10.20.0.15/32 } }] }]
    asserts:
      - failedTemplate:
          errorPattern: "needs `to` and `ports`"
  - it: refuses an extra egress rule towards the whole internet
    set:
      networkPolicy.server.extraEgress:
        - to: [{ ipBlock: { cidr: 0.0.0.0/0 } }]
          ports: [{ protocol: TCP, port: 443 }]
    asserts:
      - failedTemplate:
          errorPattern: "opens 0.0.0.0/0: name the destination itself"
  - it: an old values file without networkPolicy.server keeps the internet egress (helm upgrade --reuse-values)
    set:
      networkPolicy.server: null
    documentSelector: { path: metadata.name, value: o-ostrom-server-egress }
    asserts:
      - equal: { path: 'spec.egress[1].to[0].ipBlock.cidr', value: 0.0.0.0/0 }
  - it: refuses a range wider than /16, even split in halves
    set:
      networkPolicy.server.extraEgress:
        - to: [{ ipBlock: { cidr: 0.0.0.0/1 } }, { ipBlock: { cidr: 128.0.0.0/1 } }]
          ports: [{ protocol: TCP, port: 443 }]
    asserts:
      - failedTemplate: { errorPattern: "opens 0.0.0.0/1" }
  - it: refuses a private range as a whole
    set:
      networkPolicy.server.extraEgress:
        - to: [{ ipBlock: { cidr: 10.0.0.0/8, except: [10.1.0.0/16] } }]
          ports: [{ protocol: TCP, port: 5432 }]
    asserts:
      - failedTemplate: { errorPattern: "opens 10.0.0.0/8" }
  - it: refuses a peer that selects every pod of every namespace
    set:
      networkPolicy.server.extraEgress:
        - to: [{ namespaceSelector: {} }]
          ports: [{ protocol: TCP, port: 5432 }]
    asserts:
      - failedTemplate: { errorPattern: "selects every pod of every namespace" }
  - it: refuses a peer that selects every pod of the namespace
    set:
      networkPolicy.server.extraEgress:
        - to: [{ podSelector: {} }]
          ports: [{ protocol: TCP, port: 5432 }]
    asserts:
      - failedTemplate: { errorPattern: "selects every pod of the namespace" }
  - it: accepts an in-cluster collector named by namespace and pods
    set:
      networkPolicy.server.extraEgress:
        - to:
            - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
              podSelector: { matchLabels: { app: otel-collector } }
          ports: [{ protocol: TCP, port: 4318 }]
    documentSelector: { path: metadata.name, value: o-ostrom-server-egress }
    asserts:
      - equal: { path: 'spec.egress[1].ports[0].port', value: 4318 }
  - it: accepts a /16 subnet and an IPv6 /64
    set:
      networkPolicy.server.extraEgress:
        - to: [{ ipBlock: { cidr: 10.20.0.0/16 } }, { ipBlock: { cidr: "2001:db8:1:2::/64" } }]
          ports: [{ protocol: TCP, port: 5432 }]
    documentSelector: { path: metadata.name, value: o-ostrom-server-egress }
    asserts:
      - equal: { path: 'spec.egress[1].to[1].ipBlock.cidr', value: "2001:db8:1:2::/64" }
  - it: Polis gets its own extra rules (its external database on a private range), with the same guard
    set:
      polis.enabled: true
      networkPolicy.polis.extraEgress:
        - to: [{ ipBlock: { cidr: 10.20.0.16/32 } }]
          ports: [{ protocol: TCP, port: 5432 }]
    documentSelector: { path: metadata.name, value: o-ostrom-polis-egress }
    asserts:
      - equal: { path: 'spec.egress[1].to[0].ipBlock.cidr', value: 10.20.0.16/32 }
  - it: the Polis guard names its own key
    set:
      polis.enabled: true
      networkPolicy.polis.extraEgress: [{ ports: [{ protocol: TCP, port: 5432 }] }]
    asserts:
      - failedTemplate: { errorPattern: "networkPolicy.polis.extraEgress\\[0\\] needs" }
