{{- if .Values.server.enabled }}
{{- $full := include "ostrom.fullname" . -}}
{{- $s := .Values.server -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-server
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
data:
  OSTROM_HOST: "0.0.0.0"
  OSTROM_PORT: {{ $s.port | quote }}
  OSTROM_LOG_LEVEL: {{ $s.logLevel | quote }}
  OSTROM_DATABASE_URL: {{ include "ostrom.database.url" . | quote }}
  OSTROM_DATABASE_USER: {{ include "ostrom.database.user" . | quote }}
  OSTROM_DATABASE_MAX_CONNECTIONS: {{ $s.database.maxConnections | quote }}
  {{- if $s.trustedProxies }}
  OSTROM_TRUSTED_PROXIES: {{ $s.trustedProxies | quote }}
  {{- end }}
  {{- $delay := int $s.shutdownDelaySeconds }}
  {{- if or (lt $delay 0) (gt $delay 10) }}
  {{- fail (printf "server.shutdownDelaySeconds must be between 0 and 10, got %v" $s.shutdownDelaySeconds) }}
  {{- end }}
  OSTROM_SHUTDOWN_DELAY_SECONDS: {{ $delay | quote }}
  OSTROM_SIGNING_KEY_FILE: /var/run/ostrom/signing/instance-key.pem
  OSTROM_PUBLIC_URL: {{ .Values.global.urls.api | quote }}
  # The console's origin: device-login page, sign-in redirects, and the only origin a browser session may change
  # state from (the console serves /api/v1 on its own host, see the Ingress).
  OSTROM_CONSOLE_URL: {{ .Values.global.urls.app | quote }}
  {{- with .Values.observability.otel }}
  {{- if .enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ required "observability.otel.endpoint is required when otel is enabled" .endpoint | quote }}
  # The only protocol the server writes (ostrom-core telemetry); any other value stops its start.
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_SERVICE_NAME: {{ printf "%s-server" .serviceNamePrefix | quote }}
  {{- if .resourceAttributes }}
  OTEL_RESOURCE_ATTRIBUTES: {{ .resourceAttributes | quote }}
  {{- end }}
  {{- /* Not `default`: it would drop a ratio of 0. */}}
  {{- $ratio := ternary "" (toString .tracesSampleRatio) (kindIs "invalid" .tracesSampleRatio) }}
  {{- if ne $ratio "" }}
  {{- if not (regexMatch "^(0(\\.[0-9]+)?|1(\\.0+)?|\\.[0-9]+)$" $ratio) }}
  {{- fail (printf "observability.otel.tracesSampleRatio must be between 0 and 1, got %s" $ratio) }}
  {{- end }}
  OTEL_TRACES_SAMPLER_ARG: {{ $ratio | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- with .Values.observability.langfuse }}
  {{- if .enabled }}
  OSTROM_LANGFUSE_HOST: {{ .host | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.observability.posthog }}
  {{- if .enabled }}
  OSTROM_POSTHOG_HOST: {{ .host | quote }}
  OSTROM_POSTHOG_API_KEY: {{ .apiKey | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.cloudSessions.enabled }}
  {{- $r := .Values.cloudSessions.runner }}
  OSTROM_RUNNERS_DRIVER: kubernetes
  OSTROM_RUNNERS_SERVER_URL: {{ printf "http://%s-server.%s.svc:%v" $full .Release.Namespace $s.port | quote }}
  OSTROM_RUNNERS_IMAGE: {{ include "ostrom.image" (dict "root" . "image" $r.image "name" "ostrom-runner") | quote }}
  OSTROM_RUNNERS_WORKSPACE_SIZE: {{ $r.workspaceSize | quote }}
  OSTROM_RUNNERS_KUBERNETES_NAMESPACE: {{ .Release.Namespace | quote }}
  OSTROM_RUNNERS_KUBERNETES_STORAGE_CLASS: {{ $r.storageClass | quote }}
  {{- with .Values.global.imagePullSecrets }}
  OSTROM_RUNNERS_KUBERNETES_IMAGE_PULL_SECRET: {{ first . | quote }}
  {{- end }}
  {{- with $r.priorityClassName }}
  OSTROM_RUNNERS_KUBERNETES_PRIORITY_CLASS: {{ . | quote }}
  {{- end }}
  # The server pods' labels, for the sessions' NetworkPolicy (the only internal address a session may reach).
  OSTROM_RUNNERS_KUBERNETES_SERVER_SELECTOR: {{ printf "app.kubernetes.io/name=%s,app.kubernetes.io/instance=%s,app.kubernetes.io/component=server" (include "ostrom.name" .) .Release.Name | quote }}
  # Audit S2-10: the organizations sessions are open to. Empty = none (every organization gets 403), "*" = all.
  {{- $orgs := .Values.cloudSessions.allowedOrgs | default list }}
  {{- range $o := $orgs }}
  {{- if not (or (eq (toString $o) "*") (regexMatch "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" (toString $o))) }}
  {{- fail (printf "cloudSessions.allowedOrgs lists organization ids (UUID) or \"*\", not %v" $o) }}
  {{- end }}
  {{- end }}
  {{- if and (has "*" $orgs) (gt (len $orgs) 1) }}
  {{- fail "cloudSessions.allowedOrgs: \"*\" stands alone" }}
  {{- end }}
  OSTROM_RUNNERS_ALLOWED_ORGS: {{ join "," $orgs | quote }}
  {{- end }}
  {{- range $k, $v := $s.config }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}

{{- end }}
