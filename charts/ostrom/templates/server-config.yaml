{{- if .Values.server.enabled }}
{{- $full := include "ostrom.fullname" . -}}
{{- $s := .Values.server -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-server
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
data:
  OSTROM_HOST: "0.0.0.0"
  OSTROM_PORT: {{ $s.port | quote }}
  OSTROM_LOG_LEVEL: {{ $s.logLevel | quote }}
  OSTROM_DATABASE_URL: {{ include "ostrom.database.url" . | quote }}
  OSTROM_DATABASE_USER: {{ include "ostrom.database.user" . | quote }}
  OSTROM_DATABASE_MAX_CONNECTIONS: {{ $s.database.maxConnections | quote }}
  OSTROM_SIGNING_KEY_FILE: /var/run/ostrom/signing/instance-key.pem
  OSTROM_PUBLIC_URL: {{ .Values.global.urls.api | quote }}
  OSTROM_API_URL: {{ .Values.global.urls.api | quote }}
  OSTROM_APP_URL: {{ .Values.global.urls.app | quote }}
  OSTROM_SITE_URL: {{ .Values.global.urls.site | quote }}
  {{- with .Values.byok.extraction }}
  {{- if .provider }}
  OSTROM_EXTRACTION_PROVIDER: {{ .provider | quote }}
  OSTROM_EXTRACTION_BASE_URL: {{ .baseUrl | quote }}
  OSTROM_EXTRACTION_MODEL: {{ .model | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.observability.otel }}
  {{- if .enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ required "observability.otel.endpoint is required when otel is enabled" .endpoint | quote }}
  # The only protocol the server writes (ostrom-core telemetry); any other value stops its start.
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_SERVICE_NAME: {{ printf "%s-server" .serviceNamePrefix | quote }}
  {{- if .resourceAttributes }}
  OTEL_RESOURCE_ATTRIBUTES: {{ .resourceAttributes | quote }}
  {{- end }}
  {{- if .tracesSampleRatio }}
  OTEL_TRACES_SAMPLER_ARG: {{ .tracesSampleRatio | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- with .Values.observability.langfuse }}
  {{- if .enabled }}
  OSTROM_LANGFUSE_HOST: {{ .host | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.observability.posthog }}
  {{- if .enabled }}
  OSTROM_POSTHOG_HOST: {{ .host | quote }}
  OSTROM_POSTHOG_API_KEY: {{ .apiKey | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.polis.enabled }}
  OSTROM_SAML_POLIS_URL: {{ printf "http://%s-polis:%v" $full .Values.polis.port | quote }}
  OSTROM_SAML_POLIS_EXTERNAL_URL: {{ include "ostrom.polis.externalUrl" . | quote }}
  {{- end }}
  {{- if .Values.cloudSessions.enabled }}
  OSTROM_CLOUD_SESSIONS_ENABLED: "true"
  OSTROM_CLOUD_NAMESPACE: {{ .Release.Namespace | quote }}
  OSTROM_CLOUD_RUNNER_IMAGE: {{ include "ostrom.image" (dict "root" . "image" .Values.cloudSessions.runner.image "name" "ostrom-runner") | quote }}
  OSTROM_CLOUD_RUNNER_SERVICE_ACCOUNT: {{ printf "%s-runner" $full | quote }}
  OSTROM_CLOUD_RUNNER_LABELS: {{ printf "app.kubernetes.io/name=%s,app.kubernetes.io/instance=%s,app.kubernetes.io/component=runner" (include "ostrom.name" .) .Release.Name | quote }}
  OSTROM_CLOUD_RUNNER_CPU_REQUEST: {{ .Values.cloudSessions.runner.resources.requests.cpu | quote }}
  OSTROM_CLOUD_RUNNER_MEMORY_REQUEST: {{ .Values.cloudSessions.runner.resources.requests.memory | quote }}
  OSTROM_CLOUD_RUNNER_CPU_LIMIT: {{ .Values.cloudSessions.runner.resources.limits.cpu | quote }}
  OSTROM_CLOUD_RUNNER_MEMORY_LIMIT: {{ .Values.cloudSessions.runner.resources.limits.memory | quote }}
  OSTROM_CLOUD_RUNNER_DEADLINE_SECONDS: {{ .Values.cloudSessions.runner.activeDeadlineSeconds | quote }}
  OSTROM_CLOUD_MAX_CONCURRENT: {{ .Values.cloudSessions.runner.maxConcurrent | quote }}
  {{- with .Values.global.imagePullSecrets }}
  OSTROM_CLOUD_IMAGE_PULL_SECRETS: {{ join "," . | quote }}
  {{- end }}
  {{- end }}
  {{- range $k, $v := $s.config }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}

{{- end }}
