{{- if .Values.polis.enabled }}
{{- $full := include "ostrom.fullname" . -}}
{{- $p := .Values.polis -}}
{{- $secret := include "ostrom.polis.secretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-polis
  labels: {{- include "ostrom.labels" (dict "root" . "component" "polis") | nindent 4 }}
spec:
  replicas: {{ $p.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "ostrom.selectorLabels" (dict "root" . "component" "polis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ostrom.labels" (dict "root" . "component" "polis") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: polis
          image: {{ printf "%s:%s" $p.image.repository $p.image.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $p.port }}
          env:
            - { name: PORT, value: {{ $p.port | quote }} }
            - { name: HOSTNAME, value: "0.0.0.0" }
            - { name: NEXT_TELEMETRY_DISABLED, value: "1" }
            - { name: DO_NOT_TRACK, value: "1" }
            - { name: EXTERNAL_URL, value: {{ include "ostrom.polis.externalUrl" . | quote }} }
            - { name: NEXTAUTH_URL, value: {{ include "ostrom.polis.externalUrl" . | quote }} }
            - { name: SAML_AUDIENCE, value: {{ $p.samlAudience | quote }} }
            - { name: DB_ENGINE, value: sql }
            - { name: DB_TYPE, value: postgres }
            {{- if .Values.postgresql.enabled }}
            - { name: PG_USER, value: polis }
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "ostrom.postgresql.secretName" . }}, key: polis-password }
            - name: DB_URL
              value: {{ printf "postgres://$(PG_USER):$(PG_PASSWORD)@%s:5432/polis" (include "ostrom.postgresql.host" .) | quote }}
            {{- else }}
            # The URL holds a password: always from a Secret, never in the pod spec.
            - name: DB_URL
              valueFrom:
                secretKeyRef: { name: {{ include "ostrom.polis.dbSecretName" . }}, key: url }
            {{- end }}
            - name: JACKSON_API_KEYS
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: api-key }
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: nextauth-secret }
            - name: DB_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: db-encryption-key }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            # Next.js writes its cache next to the app: the root filesystem stays writable for Polis only.
            readOnlyRootFilesystem: false
            capabilities: { drop: [ALL] }
          resources: {{- toYaml $p.resources | nindent 12 }}
      {{- with $p.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-polis
  labels: {{- include "ostrom.labels" (dict "root" . "component" "polis") | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "ostrom.selectorLabels" (dict "root" . "component" "polis") | nindent 4 }}
  ports:
    - name: http
      port: {{ $p.port }}
      targetPort: http
{{- end }}
