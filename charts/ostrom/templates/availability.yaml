{{- $full := include "ostrom.fullname" . -}}
{{- range $name := list "server" "web" "site" }}
{{- $c := index $.Values $name }}
{{- if $c.enabled }}
{{- if $c.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $full }}-{{ $name }}
  labels: {{- include "ostrom.labels" (dict "root" $ "component" $name) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $full }}-{{ $name }}
  minReplicas: {{ $c.autoscaling.minReplicas }}
  maxReplicas: {{ $c.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $c.autoscaling.targetCPUUtilizationPercentage }} }
    {{- with $c.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: {{ . }} }
    {{- end }}
  {{- with $c.autoscaling.behavior }}
  behavior: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- /* The fewest replicas that can run: with one, a PDB of minAvailable 1 would block every node drain. */}}
{{- $fewest := ternary (int $c.autoscaling.minReplicas) (int $c.replicas) (and $c.autoscaling.enabled true) }}
{{- if and $c.podDisruptionBudget.enabled (gt $fewest 1) }}
{{- if ge (int $c.podDisruptionBudget.minAvailable) $fewest }}
{{- fail (printf "%s.podDisruptionBudget.minAvailable (%d) must be below its fewest replicas (%d), or no node could be drained" $name (int $c.podDisruptionBudget.minAvailable) $fewest) }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $full }}-{{ $name }}
  labels: {{- include "ostrom.labels" (dict "root" $ "component" $name) | nindent 4 }}
spec:
  minAvailable: {{ $c.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "ostrom.selectorLabels" (dict "root" $ "component" $name) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
