{{- if .Values.postgresql.enabled }}
{{- $full := include "ostrom.fullname" . -}}
{{- $pg := .Values.postgresql -}}
{{- $host := include "ostrom.postgresql.host" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $host }}-init
  labels: {{- include "ostrom.labels" (dict "root" . "component" "postgresql") | nindent 4 }}
data:
  # Runs once, on an empty data directory. Three roles (CONVENTIONS section 16.1): the owner, who migrates; the
  # serving role, which owns nothing and cannot bypass row-level security; Ory Polis's own role. Then `ostrom_tenant`
  # (S2-43), the block the pre-upgrade Job replays on every upgrade.
  10-roles.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      -v owner="$OSTROM_OWNER" -v owner_pw="$OSTROM_OWNER_PASSWORD" \
      -v app="$OSTROM_APP" -v app_pw="$OSTROM_APP_PASSWORD" \
      -v db="$OSTROM_DB" -v polis_pw="$OSTROM_POLIS_PASSWORD" <<'SQL'
    CREATE ROLE :"owner" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'owner_pw';
    CREATE ROLE :"app" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'app_pw';
    CREATE DATABASE :"db" OWNER :"owner";
    REVOKE ALL ON DATABASE :"db" FROM PUBLIC;
    GRANT CONNECT, TEMPORARY ON DATABASE :"db" TO :"app";
    CREATE ROLE polis LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'polis_pw';
    CREATE DATABASE polis OWNER polis;
    REVOKE ALL ON DATABASE polis FROM PUBLIC;
    \connect :"db"
    REVOKE ALL ON SCHEMA public FROM PUBLIC;
    ALTER SCHEMA public OWNER TO :"owner";
    GRANT USAGE ON SCHEMA public TO :"app";
    ALTER DEFAULT PRIVILEGES FOR ROLE :"owner" IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO :"app";
    ALTER DEFAULT PRIVILEGES FOR ROLE :"owner" IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO :"app";
    ALTER DEFAULT PRIVILEGES FOR ROLE :"owner" IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO :"app";
    -- Same block as the pre-upgrade Job (database-roles-job.yaml), idempotent (S2-43).
    {{- include "ostrom.postgresql.tenantSql" . | nindent 4 }}
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $host }}
  labels: {{- include "ostrom.labels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "ostrom.selectorLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $host }}
  labels: {{- include "ostrom.labels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  serviceName: {{ $host }}
  replicas: 1
  selector:
    matchLabels: {{- include "ostrom.selectorLabels" (dict "root" . "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ostrom.labels" (dict "root" . "component" "postgresql") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          image: {{ include "ostrom.thirdPartyImage" (merge (dict "where" "postgresql.image") $pg.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            {{- range $k, $v := $pg.parameters }}
            - "-c"
            - "{{ $k }}={{ $v }}"
            {{- end }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - { name: POSTGRES_DB, value: postgres }
            - { name: POSTGRES_USER, value: postgres }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "ostrom.postgresql.secretName" . }}, key: postgres-password }
            - { name: OSTROM_DB, value: {{ $pg.database | quote }} }
            - { name: OSTROM_OWNER, value: {{ $pg.ownerUsername | quote }} }
            - name: OSTROM_OWNER_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "ostrom.postgresql.secretName" . }}, key: owner-password }
            - { name: OSTROM_APP, value: {{ $pg.username | quote }} }
            - name: OSTROM_APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "ostrom.postgresql.secretName" . }}, key: password }
            - name: OSTROM_POLIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "ostrom.postgresql.secretName" . }}, key: polis-password }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          startupProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"] }
            periodSeconds: 2
            failureThreshold: 90
          livenessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"] }
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"] }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: init
          configMap: { name: {{ $host }}-init, defaultMode: 0555 }
      {{- with $pg.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "ostrom.selectorLabels" (dict "root" . "component" "postgresql") | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $pg.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
{{- if $pg.backup.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $host }}-backup
  labels: {{- include "ostrom.labels" (dict "root" . "component" "backup") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with $pg.backup.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $pg.backup.persistence.size }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $host }}-backup
  labels: {{- include "ostrom.labels" (dict "root" . "component" "backup") | nindent 4 }}
spec:
  schedule: {{ $pg.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: {{- include "ostrom.labels" (dict "root" . "component" "backup") | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              image: {{ include "ostrom.thirdPartyImage" (merge (dict "where" "postgresql.image") $pg.image) }}
              imagePullPolicy: {{ .Values.global.imagePullPolicy }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  mkdir -p "/backups/$stamp"
                  for db in $(psql -h "$PGHOST" -U "$PGUSER" -d postgres -Atc "SELECT datname FROM pg_database WHERE NOT datistemplate AND datname <> 'postgres'"); do
                    pg_dump -h "$PGHOST" -U "$PGUSER" -Fc -f "/backups/$stamp/$db.dump" "$db"
                  done
                  pg_dumpall -h "$PGHOST" -U "$PGUSER" --globals-only > "/backups/$stamp/globals.sql"
                  find /backups -mindepth 1 -maxdepth 1 -type d -mtime +{{ $pg.backup.keep }} -exec rm -rf {} +
                  ls -la "/backups/$stamp"
              env:
                - { name: PGHOST, value: {{ $host | quote }} }
                - { name: PGUSER, value: postgres }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: {{ include "ostrom.postgresql.secretName" . }}, key: postgres-password }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
              volumeMounts:
                - { name: backups, mountPath: /backups }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: {{ $host }}-backup }
{{- end }}
{{- end }}
