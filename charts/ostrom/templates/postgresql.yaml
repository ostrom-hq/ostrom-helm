{{- if .Values.postgresql.enabled }}
{{- $full := include "ostrom.fullname" . -}}
{{- $pg := .Values.postgresql -}}
{{- $host := include "ostrom.postgresql.host" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $host }}-init
  labels: {{- include "ostrom.labels" (dict "root" . "component" "postgresql") | nindent 4 }}
data:
  # Runs once, on an empty data directory.
  10-polis.sql: |
    CREATE DATABASE polis OWNER {{ $pg.username }};
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $host }}
  labels: {{- include "ostrom.labels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "ostrom.selectorLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $host }}
  labels: {{- include "ostrom.labels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  serviceName: {{ $host }}
  replicas: 1
  selector:
    matchLabels: {{- include "ostrom.selectorLabels" (dict "root" . "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ostrom.labels" (dict "root" . "component" "postgresql") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          image: {{ printf "%s:%s" $pg.image.repository $pg.image.tag }}
          imagePullPolicy: IfNotPresent
          args:
            {{- range $k, $v := $pg.parameters }}
            - "-c"
            - "{{ $k }}={{ $v }}"
            {{- end }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - { name: POSTGRES_DB, value: {{ $pg.database | quote }} }
            - { name: POSTGRES_USER, value: {{ $pg.username | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "ostrom.postgresql.secretName" . }}, key: password }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          startupProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ $pg.username | quote }}, "-d", {{ $pg.database | quote }}] }
            periodSeconds: 2
            failureThreshold: 90
          livenessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ $pg.username | quote }}, "-d", {{ $pg.database | quote }}] }
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ $pg.username | quote }}, "-d", {{ $pg.database | quote }}] }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: init
          configMap: { name: {{ $host }}-init }
      {{- with $pg.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "ostrom.selectorLabels" (dict "root" . "component" "postgresql") | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $pg.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
{{- if $pg.backup.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $host }}-backup
  labels: {{- include "ostrom.labels" (dict "root" . "component" "backup") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with $pg.backup.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $pg.backup.persistence.size }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $host }}-backup
  labels: {{- include "ostrom.labels" (dict "root" . "component" "backup") | nindent 4 }}
spec:
  schedule: {{ $pg.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: {{- include "ostrom.labels" (dict "root" . "component" "backup") | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              image: {{ printf "%s:%s" $pg.image.repository $pg.image.tag }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  mkdir -p "/backups/$stamp"
                  for db in $(psql -h "$PGHOST" -U "$PGUSER" -d postgres -Atc "SELECT datname FROM pg_database WHERE NOT datistemplate AND datname <> 'postgres'"); do
                    pg_dump -h "$PGHOST" -U "$PGUSER" -Fc -f "/backups/$stamp/$db.dump" "$db"
                  done
                  pg_dumpall -h "$PGHOST" -U "$PGUSER" --globals-only > "/backups/$stamp/globals.sql"
                  find /backups -mindepth 1 -maxdepth 1 -type d -mtime +{{ $pg.backup.keep }} -exec rm -rf {} +
                  ls -la "/backups/$stamp"
              env:
                - { name: PGHOST, value: {{ $host | quote }} }
                - { name: PGUSER, value: {{ $pg.username | quote }} }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: {{ include "ostrom.postgresql.secretName" . }}, key: password }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
              volumeMounts:
                - { name: backups, mountPath: /backups }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: {{ $host }}-backup }
{{- end }}
{{- end }}
