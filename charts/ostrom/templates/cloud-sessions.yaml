{{- if and .Values.server.enabled .Values.cloudSessions.enabled }}
{{- $full := include "ostrom.fullname" . -}}
{{- if .Values.cloudSessions.rbac.create }}
# What the server's session controller may do — in this namespace only (a Role, never a ClusterRole).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $full }}-session-controller
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    # Per-session credentials, deleted with the session.
    resources: [secrets]
    verbs: [create, delete, deletecollection]
  - apiGroups: [""]
    # One workspace volume per session.
    resources: [persistentvolumeclaims]
    verbs: [get, create, delete]
  - apiGroups: [networking.k8s.io]
    # The sessions' own policies (no ingress; DNS, the server and the public internet only).
    resources: [networkpolicies]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $full }}-session-controller
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $full }}-session-controller
subjects:
  - kind: ServiceAccount
    name: {{ $full }}-server
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
