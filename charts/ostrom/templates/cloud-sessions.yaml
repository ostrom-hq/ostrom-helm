{{- if and .Values.server.enabled .Values.cloudSessions.enabled }}
{{- $full := include "ostrom.fullname" . -}}
# The identity of the session pods: no Kubernetes API access at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-runner
  labels: {{- include "ostrom.labels" (dict "root" . "component" "runner") | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.cloudSessions.rbac.create }}
---
# What the server's session controller may do — in this namespace only (a Role, never a ClusterRole).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $full }}-session-controller
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods/log, pods/status]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/attach]
    verbs: [create, get]
  - apiGroups: [""]
    # Per-session credentials (the session token, the repository token), deleted with the session.
    resources: [secrets]
    verbs: [create, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $full }}-session-controller
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $full }}-session-controller
subjects:
  - kind: ServiceAccount
    name: {{ $full }}-server
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
