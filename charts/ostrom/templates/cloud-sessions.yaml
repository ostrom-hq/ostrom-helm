{{- if and .Values.server.enabled .Values.cloudSessions.enabled }}
{{- $full := include "ostrom.fullname" . -}}
{{- if .Values.cloudSessions.rbac.create }}
# What the server's session controller may do — in this namespace only (a Role, never a ClusterRole).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $full }}-session-controller
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    # Per-session credentials, deleted with the session.
    resources: [secrets]
    verbs: [create, delete, deletecollection]
  - apiGroups: [""]
    # One workspace volume per session; listed by the garbage collection, which deletes the claims no session owns.
    resources: [persistentvolumeclaims]
    verbs: [get, list, create, delete]
  - apiGroups: [networking.k8s.io]
    # The sessions' own policies (no ingress; DNS, the server and the public internet only).
    resources: [networkpolicies]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $full }}-session-controller
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $full }}-session-controller
subjects:
  - kind: ServiceAccount
    name: {{ $full }}-server
    namespace: {{ .Release.Namespace }}
{{- if .Values.cloudSessions.rbac.volumeReader }}
---
# Opt-in, the chart's only cluster-wide objects: read PersistentVolumes and StorageClasses (TeamCode's
# docs/cloud-sessions.md). The server proves a deleted session's volume is gone, counts the orphaned volumes of its
# garbage collection and refuses a profile whose storage class keeps volumes. Read only: it never deletes a volume.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $full }}-{{ .Release.Namespace }}-volume-reader
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $full }}-{{ .Release.Namespace }}-volume-reader
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $full }}-{{ .Release.Namespace }}-volume-reader
subjects:
  - kind: ServiceAccount
    name: {{ $full }}-server
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.cloudSessions.rbac.tokenReview }}
---
# Opt-in: the built-in system:auth-delegator (create TokenReviews and SubjectAccessReviews, nothing else), so the
# server can review the projected token a session's runner presents (TeamCode's pod identity).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $full }}-{{ .Release.Namespace }}-token-review
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ $full }}-server
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
