{{- $full := include "ostrom.fullname" . -}}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ostrom.postgresql.secretName" . }}
  labels: {{- include "ostrom.labels" (dict "root" . "component" "postgresql") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- $sec := include "ostrom.postgresql.secretName" . }}
  # The superuser: initdb, backups. Never given to Ostrom.
  postgres-password: {{ include "ostrom.keepOrGenerate" (dict "root" . "secret" $sec "key" "postgres-password" "length" 32) | quote }}
  # The owner of the ostrom database: migrations only (`ostrom-server migrate`).
  owner-password: {{ include "ostrom.keepOrGenerate" (dict "root" . "secret" $sec "key" "owner-password" "length" 32) | quote }}
  # The serving role: owns nothing, NOSUPERUSER NOBYPASSRLS (row-level security applies to it).
  password: {{ .Values.postgresql.password | default (include "ostrom.keepOrGenerate" (dict "root" . "secret" $sec "key" "password" "length" 32)) | quote }}
  # Ory Polis's own role and database.
  polis-password: {{ include "ostrom.keepOrGenerate" (dict "root" . "secret" $sec "key" "polis-password" "length" 32) | quote }}
---
{{- end }}
{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-external-db
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "externalDatabase.password or externalDatabase.existingSecret is required" .Values.externalDatabase.password | quote }}
  migration-password: {{ required "externalDatabase.migrationPassword or externalDatabase.existingSecret is required" .Values.externalDatabase.migrationPassword | quote }}
---
{{- end }}
{{- if and .Values.server.enabled (not .Values.server.signingKey.existingSecret) }}
{{- $name := include "ostrom.signingKey.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
  annotations:
    # The instance key signs every receipt: never delete it with the release.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (hasKey $existing.data "instance-key.pem") }}
  instance-key.pem: {{ index $existing.data "instance-key.pem" }}
  {{- else }}
  instance-key.pem: {{ genPrivateKey "ed25519" | b64enc }}
  {{- end }}
---
{{- end }}
{{- if hasKey .Values.server.secretEnv "OSTROM_SECRETS_KEY" }}
{{- fail "server.secretEnv.OSTROM_SECRETS_KEY is not read: put the key in a Secret (key `secrets-key`) and set server.secretsKey.existingSecret" }}
{{- end }}
{{- if and .Values.server.enabled (not (include "ostrom.secretsKey.existingSecret" .)) }}
{{- $name := include "ostrom.secretsKey.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
  annotations:
    # The key seals every org secret: never delete it with the release, never regenerate it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (hasKey $existing.data "secrets-key") }}
  secrets-key: {{ index $existing.data "secrets-key" }}
  {{- else }}
  # randBytes: 32 bytes from crypto/rand, base64-encoded, which is the value OSTROM_SECRETS_KEY takes.
  secrets-key: {{ randBytes 32 | b64enc }}
  {{- end }}
---
{{- end }}
{{- if and .Values.server.enabled (not .Values.server.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ostrom.server.secretName" . }}
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.server.secretEnv }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  {{- with .Values.observability.otel }}
  {{- if and .enabled .headers (not .existingSecret) }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ .headers | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.observability.langfuse }}
  {{- if and .enabled (not .existingSecret) }}
  OSTROM_LANGFUSE_PUBLIC_KEY: {{ .publicKey | quote }}
  OSTROM_LANGFUSE_SECRET_KEY: {{ .secretKey | quote }}
  {{- end }}
  {{- end }}
---
{{- end }}
{{- if and .Values.polis.enabled (not .Values.polis.existingSecret) }}
{{- $name := include "ostrom.polis.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "ostrom.labels" (dict "root" . "component" "polis") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  api-key: {{ .Values.polis.apiKey | default (include "ostrom.keepOrGenerate" (dict "root" . "secret" $name "key" "api-key" "length" 48)) | quote }}
  nextauth-secret: {{ include "ostrom.keepOrGenerate" (dict "root" . "secret" $name "key" "nextauth-secret" "length" 48) | quote }}
  # Ory Polis encrypts its stored secrets with this key: exactly 32 characters, kept forever.
  db-encryption-key: {{ include "ostrom.keepOrGenerate" (dict "root" . "secret" $name "key" "db-encryption-key" "length" 32) | quote }}
---
{{- end }}
