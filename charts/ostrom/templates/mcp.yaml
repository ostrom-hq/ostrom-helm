{{- /*
The MCP stdio host (ostrom-server docs/mcp-host.md): one Deployment that owns every hosted stdio MCP process, reached by
the server pods through its Service with the host token. It has no database, no encryption key and no Kubernetes token.
Ported from TeamCode's chart (helm/teamcode/templates/mcp.yaml). Everything but `mcp.enabled`, `mcp.image` and
`mcp.token` is fixed here; the host's own defaults apply to what no variable sets.
*/}}
{{- if include "ostrom.mcp.enabled" . }}
{{- $full := include "ostrom.mcp.fullname" . }}
{{- $mcp := .Values.mcp }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}
  labels: {{- include "ostrom.labels" (dict "root" . "component" "mcp") | nindent 4 }}
# No Role or RoleBinding anywhere: the host never talks to the Kubernetes API.
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}
  labels: {{- include "ostrom.labels" (dict "root" . "component" "mcp") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
  selector: {{- include "ostrom.selectorLabels" (dict "root" . "component" "mcp") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}
  labels: {{- include "ostrom.labels" (dict "root" . "component" "mcp") | nindent 4 }}
spec:
  # One host owns every process. More replicas would each start their own copy of a server.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {{- include "ostrom.selectorLabels" (dict "root" . "component" "mcp") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/mcp-token: {{ include "ostrom.mcp.tokenChecksum" . }}
      labels: {{- include "ostrom.labels" (dict "root" . "component" "mcp") | nindent 8 }}
    spec:
      {{- include "ostrom.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ $full }}
      automountServiceAccountToken: false
      # The processes' environment is built from scratch by the host; no service variables to leak either way.
      enableServiceLinks: false
      # Longer than the host's drain (OSTROM_MCP_HOST_DRAIN_SECONDS, 75 s), or running MCP calls are killed on a rollout.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          securityContext:
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          # mcp.image.tag: the full commit of the last host image built on ostrom-server main; mcp.image.digest wins over it.
          image: {{ include "ostrom.image" (dict "root" . "image" $mcp.image "name" "ostrom-mcp-host") }}
          imagePullPolicy: {{ $mcp.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: OSTROM_MCP_HOST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ostrom.mcp.tokenSecretName" . }}
                  key: {{ include "ostrom.mcp.tokenSecretKey" . }}
            - name: OSTROM_MCP_HOST_ADDRESS
              value: "0.0.0.0"
            - name: OSTROM_MCP_HOST_PORT
              value: "8090"
            - name: OSTROM_MCP_HOST_DATA_DIR
              value: /var/mcp
            - name: OSTROM_MCP_HOST_DRAIN_SECONDS
              value: "75"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            failureThreshold: 2
            timeoutSeconds: 2
          # The pod's memory limit is the hard bound for the JVM and every process tree together: about 360 MiB for a
          # Node.js server through npx, 200 MiB for a Python one through uvx, so 2Gi holds about four busy servers.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 2Gi
              ephemeral-storage: 4Gi
          volumeMounts:
            - name: data
              mountPath: /var/mcp
            - name: tmp
              mountPath: /tmp
      volumes:
        # One directory per process key (home, working directory, npm and uv caches); nothing outlives the pod.
        - name: data
          emptyDir:
            sizeLimit: 3Gi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
{{- if not (include "ostrom.mcp.existingSecret" .) }}
---
# The host token, generated once: an upgrade reads the existing value back (lookup) and keeps it, and `helm uninstall`
# leaves the Secret in place. Rotate by deleting it, then `helm upgrade`: both Deployments roll (checksum/mcp-token).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}
  labels: {{- include "ostrom.labels" (dict "root" . "component" "mcp") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ include "ostrom.mcp.generatedToken" . }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# Ingress: this release's server pods only, on 8090. Egress: DNS to the cluster's resolver (the release's shared
# `-dns` policy, networkPolicy.dns), then the public Internet only (registries and the
# servers' own APIs), never pod, service, node, private, link-local or metadata addresses. Enforced by CNIs that
# implement NetworkPolicy. The same ranges as TeamCode's host policy, with its NAT64 and 6to4 forms of the IPv4 ranges.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}
  labels: {{- include "ostrom.labels" (dict "root" . "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "ostrom.selectorLabels" (dict "root" . "component" "mcp") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - {{- include "ostrom.np.peer" (dict "root" . "component" "server") | nindent 10 }}
      ports:
        - protocol: TCP
          port: 8090
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: ["0.0.0.0/8", "10.0.0.0/8", "100.64.0.0/10", "127.0.0.0/8", "169.254.0.0/16", "172.16.0.0/12", "192.0.0.0/24", "192.168.0.0/16", "198.18.0.0/15", "224.0.0.0/3", "168.63.129.16/32"]
    # Not public IPv6, then the NAT64 (64:ff9b::/96) and 6to4 (2002::/16) forms of the IPv4 ranges above, so DNS64 clusters keep public IPv4-only sites.
    - to:
        - ipBlock:
            cidr: ::/0
            except: ["::/127", "64:ff9b:1::/48", "2001::/32", "fc00::/7", "fe80::/10", "ff00::/8", "64:ff9b::/104", "2002::/24", "64:ff9b::a00:0/104", "2002:a00::/24", "64:ff9b::6440:0/106", "2002:6440::/26", "64:ff9b::7f00:0/104", "2002:7f00::/24", "64:ff9b::a9fe:0/112", "2002:a9fe::/32", "64:ff9b::ac10:0/108", "2002:ac10::/28", "64:ff9b::c000:0/120", "2002:c000::/40", "64:ff9b::c0a8:0/112", "2002:c0a8::/32", "64:ff9b::c612:0/111", "2002:c612::/31", "64:ff9b::e000:0/99", "2002:e000::/19", "64:ff9b::a83f:8110/128", "2002:a83f:8110::/48"]
{{- end }}
{{- end }}
