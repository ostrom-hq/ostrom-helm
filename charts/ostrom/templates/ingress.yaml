{{- if .Values.ingress.enabled }}
{{- $full := include "ostrom.fullname" . -}}
{{- $i := .Values.ingress -}}
{{- $routes := list -}}
{{- $server := printf "%s-server" $full -}}
{{- $sport := .Values.server.service.port -}}
{{- /* One origin for the browser (the session cookie and its CSRF token are read on the console's origin): the
       console's host serves /api/v1 from the server too. The API host serves everything for non-browser clients
       (CLI, tokens, webhooks). */ -}}
{{- $apiRules := list (dict "host" $i.hosts.api "path" "/") -}}
{{- if .Values.web.enabled }}{{ $apiRules = append $apiRules (dict "host" $i.hosts.app "path" "/api/v1") }}{{ end -}}
{{- if .Values.server.enabled }}{{ $routes = append $routes (dict "name" "api" "rules" $apiRules "svc" $server "port" $sport "annotations" $i.apiAnnotations) }}{{ end -}}
{{- if and .Values.server.enabled $i.artifactsBodySize }}
{{- $artRules := list (dict "host" $i.hosts.api "path" "/api/v1/artifacts") -}}
{{- if .Values.web.enabled }}{{ $artRules = append $artRules (dict "host" $i.hosts.app "path" "/api/v1/artifacts") }}{{ end -}}
{{- $routes = append $routes (dict "name" "api-artifacts" "rules" $artRules "svc" $server "port" $sport "annotations" (merge (dict "nginx.ingress.kubernetes.io/proxy-body-size" $i.artifactsBodySize) $i.apiAnnotations)) }}
{{- end -}}
{{- if .Values.web.enabled }}{{ $routes = append $routes (dict "name" "app" "rules" (list (dict "host" $i.hosts.app "path" "/")) "svc" (printf "%s-web" $full) "port" .Values.web.service.port "annotations" dict) }}{{ end -}}
{{- if .Values.site.enabled }}
{{- $siteRules := list -}}
{{- range $h := concat (list $i.hosts.site) $i.hosts.siteAliases }}{{ $siteRules = append $siteRules (dict "host" $h "path" "/") }}{{ end -}}
{{- $routes = append $routes (dict "name" "site" "rules" $siteRules "svc" (printf "%s-site" $full) "port" .Values.site.service.port "annotations" dict) }}
{{- end -}}
{{- if .Values.polis.enabled }}{{ $routes = append $routes (dict "name" "sso" "rules" (list (dict "host" $i.hosts.sso "path" "/")) "svc" (printf "%s-polis" $full) "port" .Values.polis.port "annotations" dict) }}{{ end -}}
{{- if and $i.cloudflareOriginPulls.enabled $routes }}
---
# Cloudflare's origin-pull CA (public): the client certificate every Ingress below requires.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-cloudflare-origin-pull-ca
  labels: {{- include "ostrom.labels" (dict "root" . "component" "ingress") | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ .Files.Get "files/cloudflare-origin-pull-ca.pem" | b64enc }}
{{- end }}
{{- range $r := $routes }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}-{{ $r.name }}
  labels: {{- include "ostrom.labels" (dict "root" $ "component" $r.name) | nindent 4 }}
  annotations:
    {{- with $i.certManager.issuer }}
    cert-manager.io/issuer: {{ . }}
    {{- end }}
    {{- with $i.certManager.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . }}
    {{- end }}
    {{- if $i.cloudflareOriginPulls.enabled }}
    nginx.ingress.kubernetes.io/auth-tls-secret: {{ printf "%s/%s-cloudflare-origin-pull-ca" $.Release.Namespace $full | quote }}
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    {{- end }}
    {{- with $i.annotations }}{{ toYaml . | nindent 4 }}{{- end }}
    {{- with $r.annotations }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  {{- with $i.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $i.tls.enabled }}
  tls:
    - hosts:
        {{- range $h := $r.rules | uniq }}
        - {{ $h.host | quote }}
        {{- end }}
      secretName: {{ include "ostrom.tls.secretName" $ }}
  {{- end }}
  rules:
    {{- range $rule := $r.rules }}
    - host: {{ $rule.host | quote }}
      http:
        paths:
          - path: {{ $rule.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $r.svc }}
                port:
                  number: {{ $r.port }}
    {{- end }}
{{- end }}
{{- end }}
