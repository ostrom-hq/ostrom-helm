{{- if .Values.server.enabled }}
{{- $full := include "ostrom.fullname" . -}}
{{- $s := .Values.server -}}
{{- if and .Values.cloudSessions.enabled (or (gt (int $s.replicas) 1) $s.autoscaling.enabled) }}
{{- fail "cloudSessions.enabled needs exactly one server replica (server.replicas: 1, no autoscaling): the terminal relay lives in memory" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-server
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# The token is mounted only when the server drives cloud sessions through the Kubernetes API.
automountServiceAccountToken: {{ .Values.cloudSessions.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-server
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  {{- if not $s.autoscaling.enabled }}
  replicas: {{ $s.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {{- include "ostrom.selectorLabels" (dict "root" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 8 }}
        {{- with $s.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/server-config.yaml") . | sha256sum | trunc 16 }}
        checksum/secrets: {{ toYaml (dict "env" $s.secretEnv "obs" .Values.observability) | sha256sum | trunc 16 }}
        {{- with $s.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ $full }}-server
      # Said on the pod too, not only on the ServiceAccount: a token only for cloud sessions (Kubernetes API).
      automountServiceAccountToken: {{ .Values.cloudSessions.enabled }}
      {{- include "ostrom.imagePullSecrets" . | nindent 6 }}
      # The image's user (distroless nonroot); fsGroup lets it read the mounted signing key.
      securityContext:
        {{- toYaml (mergeOverwrite (deepCopy .Values.podSecurityContext) (dict "runAsUser" $s.runAsUser "runAsGroup" $s.runAsUser "fsGroup" $s.runAsUser)) | nindent 8 }}
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      {{- if .Values.migrations.initContainer }}
      initContainers:
        - name: migrate
          image: {{ include "ostrom.image" (dict "root" . "image" $s.image "name" "ostrom-server") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: {{- toYaml .Values.migrations.command | nindent 12 }}
          # The owner's credentials live in this step only: the serving container never receives them (CONVENTIONS 16.1).
          env:
            - { name: OSTROM_LOG_LEVEL, value: {{ $s.logLevel | quote }} }
            - { name: OSTROM_DATABASE_MIGRATION_USER, value: {{ include "ostrom.database.ownerUser" . | quote }} }
            - name: OSTROM_DATABASE_MIGRATION_PASSWORD
              valueFrom:
                secretKeyRef: {{- include "ostrom.database.ownerPasswordRef" . | nindent 18 }}
            - name: OSTROM_DATABASE_MIGRATION_URL
              value: {{ regexReplaceAll "^([a-z]+)://" (include "ostrom.database.url" .) "${1}://$(OSTROM_DATABASE_MIGRATION_USER):$(OSTROM_DATABASE_MIGRATION_PASSWORD)@" | quote }}
          {{- include "ostrom.containerSecurityContext" . | nindent 10 }}
          resources: {{- toYaml $s.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "ostrom.image" (dict "root" . "image" $s.image "name" "ostrom-server") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- with $s.command }}
          command: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $s.args }}
          args: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $s.port }}
          envFrom:
            - configMapRef: { name: {{ $full }}-server }
            - secretRef: { name: {{ include "ostrom.server.secretName" . }} }
            {{- with $s.extraEnvFrom }}{{ toYaml . | nindent 12 }}{{- end }}
          env:
            - name: OSTROM_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: {{- include "ostrom.database.passwordRef" . | nindent 18 }}
            - name: OSTROM_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            # One key for every replica, kept across upgrades (SECURITY-AUDIT S2-11): never a per-pod key file.
            - name: OSTROM_SECRETS_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "ostrom.secretsKey.secretName" . }}, key: secrets-key }
            {{- with .Values.observability.otel }}
            {{- if and .enabled .existingSecret }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef: { name: {{ .existingSecret }}, key: headers }
            {{- end }}
            {{- end }}
            {{- with .Values.observability.langfuse }}
            {{- if and .enabled .existingSecret }}
            - name: OSTROM_LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef: { name: {{ .existingSecret }}, key: public-key }
            - name: OSTROM_LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ .existingSecret }}, key: secret-key }
            {{- end }}
            {{- end }}
            {{- with $s.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
          startupProbe:
            httpGet: { path: {{ $s.probes.startup.path }}, port: http }
            periodSeconds: {{ $s.probes.startup.periodSeconds }}
            failureThreshold: {{ $s.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet: { path: {{ $s.probes.liveness.path }}, port: http }
            periodSeconds: {{ $s.probes.liveness.periodSeconds }}
            failureThreshold: {{ $s.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet: { path: {{ $s.probes.readiness.path }}, port: http }
            periodSeconds: {{ $s.probes.readiness.periodSeconds }}
            failureThreshold: {{ $s.probes.readiness.failureThreshold }}
          {{- include "ostrom.containerSecurityContext" . | nindent 10 }}
          resources: {{- toYaml $s.resources | nindent 12 }}
          volumeMounts:
            - name: signing-key
              mountPath: /var/run/ostrom/signing
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/ostrom
      volumes:
        - name: signing-key
          secret:
            secretName: {{ include "ostrom.signingKey.secretName" . }}
            defaultMode: 0440
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: data
          emptyDir: { sizeLimit: 64Mi }
      {{- with $s.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity: {{- include "ostrom.affinity" (dict "root" . "component" "server" "affinity" $s.affinity) | nindent 8 }}
      {{- with $s.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-server
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  type: {{ $s.service.type }}
  selector: {{- include "ostrom.selectorLabels" (dict "root" . "component" "server") | nindent 4 }}
  ports:
    - name: http
      port: {{ $s.service.port }}
      targetPort: http
{{- end }}
