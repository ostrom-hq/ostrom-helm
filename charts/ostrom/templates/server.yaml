{{- if .Values.server.enabled }}
{{- $full := include "ostrom.fullname" . -}}
{{- $s := .Values.server -}}
{{- /* The token is mounted only when the server drives cloud sessions through the Kubernetes API: said on the
ServiceAccount and on the pod, from this one value. */ -}}
{{- $token := .Values.cloudSessions.enabled -}}
{{- if and .Values.cloudSessions.enabled (or (gt (int $s.replicas) 1) $s.autoscaling.enabled) }}
{{- fail "cloudSessions.enabled needs exactly one server replica (server.replicas: 1, no autoscaling): the terminal relay lives in memory" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-server
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $token }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-server
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  {{- if not $s.autoscaling.enabled }}
  replicas: {{ $s.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {{- include "ostrom.selectorLabels" (dict "root" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 8 }}
        {{- with $s.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/server-config.yaml") . | sha256sum | trunc 16 }}
        checksum/secrets: {{ toYaml (dict "env" $s.secretEnv "obs" .Values.observability) | sha256sum | trunc 16 }}
        {{- if include "ostrom.mcp.enabled" . }}
        # The host token rolls the server with its host after a rotation (templates/mcp.yaml).
        checksum/mcp-token: {{ include "ostrom.mcp.tokenChecksum" . }}
        {{- end }}
        {{- with $s.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ $full }}-server
      automountServiceAccountToken: {{ $token }}
      {{- include "ostrom.imagePullSecrets" . | nindent 6 }}
      # The image's user (distroless nonroot); fsGroup lets it read the mounted signing key.
      securityContext:
        {{- toYaml (mergeOverwrite (deepCopy .Values.podSecurityContext) (dict "runAsUser" $s.runAsUser "runAsGroup" $s.runAsUser "fsGroup" $s.runAsUser)) | nindent 8 }}
      enableServiceLinks: false
      {{- $grace := int $s.terminationGracePeriodSeconds }}
      {{- $needed := add (int $s.shutdownDelaySeconds) (int $s.shutdownGraceSeconds) 15 }}
      {{- if le $grace $needed }}
      {{- fail (printf "server.terminationGracePeriodSeconds (%d) must be longer than shutdownDelaySeconds + shutdownGraceSeconds + 15 (%d), or calls in flight are killed during a rollout" $grace $needed) }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $grace }}
      {{- $proxy := include "ostrom.dbProxy.enabled" . }}
      {{- if or .Values.migrations.initContainer $proxy }}
      initContainers:
        {{- if $proxy }}
        {{- $t := .Values.externalDatabase.tls }}
        # externalDatabase.tls (AUDIT-SECU-HELM-2 H1): the server passes no sslmode to its driver. The config step writes the
        # proxy's password file in memory; the proxy (a native sidecar: it starts before `migrate` and lives with the
        # pod) dials the database in TLS and checks its certificate. The server and `migrate` reach it on 127.0.0.1.
        - name: db-proxy-config
          image: {{ include "ostrom.thirdPartyImage" (merge (dict "where" "externalDatabase.tls.proxy.image") $t.proxy.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              # PgBouncer's auth_file: "user" "password", a double quote doubled.
              q() { printf '%s' "$1" | sed 's/"/""/g'; }
              {
                printf '"%s" "%s"\n' "$(q "$APP_USER")" "$(q "$APP_PASSWORD")"
                if [ -n "${OWNER_USER:-}" ]; then printf '"%s" "%s"\n' "$(q "$OWNER_USER")" "$(q "$OWNER_PASSWORD")"; fi
              } > /run/ostrom/db-proxy/userlist.txt
          env:
            - { name: APP_USER, value: {{ include "ostrom.database.user" . | quote }} }
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef: {{- include "ostrom.database.passwordRef" . | nindent 18 }}
            {{- if .Values.migrations.initContainer }}
            # The owner's password, for `migrate` only: the proxy asks every client for its password (SCRAM), so the
            # server container, which never receives this one, cannot log in as the owner through it.
            - { name: OWNER_USER, value: {{ include "ostrom.database.ownerUser" . | quote }} }
            - name: OWNER_PASSWORD
              valueFrom:
                secretKeyRef: {{- include "ostrom.database.ownerPasswordRef" . | nindent 18 }}
            {{- end }}
          {{- include "ostrom.containerSecurityContext" . | nindent 10 }}
          resources: {{- toYaml $t.proxy.resources | nindent 12 }}
          volumeMounts:
            - { name: db-proxy, mountPath: /run/ostrom/db-proxy }
        - name: db-proxy
          image: {{ include "ostrom.thirdPartyImage" (merge (dict "where" "externalDatabase.tls.proxy.image") $t.proxy.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          restartPolicy: Always
          args: ["/etc/ostrom/db-proxy/pgbouncer.ini"]
          # It listens on the pod's loopback only, which a kubelet tcpSocket probe cannot reach: bash's /dev/tcp.
          startupProbe:
            exec: { command: ["/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/{{ include "ostrom.dbProxy.port" . }}"] }
            periodSeconds: 1
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            exec: { command: ["/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/{{ include "ostrom.dbProxy.port" . }}"] }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          {{- include "ostrom.containerSecurityContext" . | nindent 10 }}
          resources: {{- toYaml $t.proxy.resources | nindent 12 }}
          volumeMounts:
            - { name: db-proxy, mountPath: /run/ostrom/db-proxy, readOnly: true }
            - { name: db-proxy-config, mountPath: /etc/ostrom/db-proxy, readOnly: true }
            {{- if ne $t.mode "require" }}
            - { name: db-ca, mountPath: /etc/ostrom/db-ca, readOnly: true }
            {{- end }}
        {{- end }}
        {{- if .Values.migrations.initContainer }}
        - name: migrate
          image: {{ include "ostrom.image" (dict "root" . "image" $s.image "name" "ostrom-server") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: {{- toYaml .Values.migrations.command | nindent 12 }}
          # The owner's credentials live in this step only: the serving container never receives them (CONVENTIONS 16.1).
          env:
            - { name: OSTROM_LOG_LEVEL, value: {{ $s.logLevel | quote }} }
            - { name: OSTROM_DATABASE_MIGRATION_USER, value: {{ include "ostrom.database.ownerUser" . | quote }} }
            - name: OSTROM_DATABASE_MIGRATION_PASSWORD
              valueFrom:
                secretKeyRef: {{- include "ostrom.database.ownerPasswordRef" . | nindent 18 }}
            - name: OSTROM_DATABASE_MIGRATION_URL
              value: {{ regexReplaceAll "^([a-z]+)://" (include "ostrom.database.url" .) "${1}://$(OSTROM_DATABASE_MIGRATION_USER):$(OSTROM_DATABASE_MIGRATION_PASSWORD)@" | quote }}
            {{- with $s.javaToolOptions }}
            - { name: JAVA_TOOL_OPTIONS, value: {{ . | quote }} }
            {{- end }}
          {{- include "ostrom.containerSecurityContext" . | nindent 10 }}
          resources: {{- toYaml $s.resources | nindent 12 }}
        {{- end }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "ostrom.image" (dict "root" . "image" $s.image "name" "ostrom-server") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- with $s.command }}
          command: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $s.args }}
          args: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $s.port }}
          envFrom:
            - configMapRef: { name: {{ $full }}-server }
            - secretRef: { name: {{ include "ostrom.server.secretName" . }} }
            {{- with $s.extraEnvFrom }}{{ toYaml . | nindent 12 }}{{- end }}
          env:
            - name: OSTROM_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: {{- include "ostrom.database.passwordRef" . | nindent 18 }}
            - name: OSTROM_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            {{- with $s.javaToolOptions }}
            - { name: JAVA_TOOL_OPTIONS, value: {{ . | quote }} }
            {{- end }}
            # One key for every replica, kept across upgrades (SECURITY-AUDIT S2-11): never a per-pod key file.
            - name: OSTROM_SECRETS_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "ostrom.secretsKey.secretName" . }}, key: secrets-key }
            {{- if include "ostrom.mcp.enabled" . }}
            # The MCP stdio host of this release (templates/mcp.yaml) and its token: both or neither, never in the ConfigMap.
            - name: OSTROM_MCP_HOST_URL
              value: {{ include "ostrom.mcp.url" . | quote }}
            - name: OSTROM_MCP_HOST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ostrom.mcp.tokenSecretName" . }}
                  key: {{ include "ostrom.mcp.tokenSecretKey" . }}
            {{- end }}
            {{- with .Values.observability.otel }}
            {{- if and .enabled .existingSecret }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef: { name: {{ .existingSecret }}, key: headers }
            {{- end }}
            {{- end }}
            {{- with .Values.observability.langfuse }}
            {{- if and .enabled .existingSecret }}
            - name: OSTROM_LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef: { name: {{ .existingSecret }}, key: public-key }
            - name: OSTROM_LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ .existingSecret }}, key: secret-key }
            {{- end }}
            {{- end }}
            {{- with $s.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
          startupProbe:
            httpGet: { path: {{ $s.probes.startup.path }}, port: http }
            periodSeconds: {{ $s.probes.startup.periodSeconds }}
            failureThreshold: {{ $s.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet: { path: {{ $s.probes.liveness.path }}, port: http }
            periodSeconds: {{ $s.probes.liveness.periodSeconds }}
            failureThreshold: {{ $s.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet: { path: {{ $s.probes.readiness.path }}, port: http }
            periodSeconds: {{ $s.probes.readiness.periodSeconds }}
            failureThreshold: {{ $s.probes.readiness.failureThreshold }}
          {{- include "ostrom.containerSecurityContext" . | nindent 10 }}
          resources: {{- toYaml $s.resources | nindent 12 }}
          volumeMounts:
            - name: signing-key
              mountPath: /var/run/ostrom/signing
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/ostrom
      volumes:
        - name: signing-key
          secret:
            secretName: {{ include "ostrom.signingKey.secretName" . }}
            defaultMode: 0440
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: data
          emptyDir: { sizeLimit: 64Mi }
        {{- if include "ostrom.dbProxy.enabled" . }}
        {{- $t := .Values.externalDatabase.tls }}
        - name: db-proxy
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        - name: db-proxy-config
          configMap: { name: {{ $full }}-db-proxy }
        {{- if ne $t.mode "require" }}
        - name: db-ca
          {{- if $t.ca.secretName }}
          secret: { secretName: {{ $t.ca.secretName }}, items: [{ key: {{ $t.ca.key }}, path: {{ $t.ca.key }} }] }
          {{- else }}
          configMap: { name: {{ $t.ca.configMapName }}, items: [{ key: {{ $t.ca.key }}, path: {{ $t.ca.key }} }] }
          {{- end }}
        {{- end }}
        {{- end }}
      {{- with $s.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity: {{- include "ostrom.affinity" (dict "root" . "component" "server" "affinity" $s.affinity) | nindent 8 }}
      {{- with $s.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-server
  labels: {{- include "ostrom.labels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  type: {{ $s.service.type }}
  selector: {{- include "ostrom.selectorLabels" (dict "root" . "component" "server") | nindent 4 }}
  ports:
    - name: http
      port: {{ $s.service.port }}
      targetPort: http
{{- end }}
