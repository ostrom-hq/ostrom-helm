{{- if .Values.postgresql.enabled }}
{{- $full := include "ostrom.fullname" . -}}
{{- $pg := .Values.postgresql -}}
{{- $host := include "ostrom.postgresql.host" . -}}
{{- /*
Before every upgrade, the roles the server needs (SECURITY-AUDIT S2-43), replayed as the superuser: a database
initialised by an older chart has an owner without CREATEROLE and no `ostrom_tenant`, and `ostrom-server migrate`
would then fail. Idempotent (only NOTICEs when everything is there). Not on install: the init script does it, and the
StatefulSet does not exist yet when pre-install hooks run. Hooks run before the release's own NetworkPolicies are
updated, so the two policies that let this pod reach PostgreSQL are hooks too, created first (weight -20).
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-db-roles-egress
  labels: {{- include "ostrom.labels" (dict "root" . "component" "network") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels: {{- include "ostrom.selectorLabels" (dict "root" . "component" "db-roles") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - {{- include "ostrom.np.peer" (dict "root" . "component" "postgresql") | nindent 10 }}
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-postgresql-from-db-roles
  labels: {{- include "ostrom.labels" (dict "root" . "component" "network") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels: {{- include "ostrom.selectorLabels" (dict "root" . "component" "postgresql") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - {{- include "ostrom.np.peer" (dict "root" . "component" "db-roles") | nindent 10 }}
      ports: [{ protocol: TCP, port: 5432 }]
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}-db-roles
  labels: {{- include "ostrom.labels" (dict "root" . "component" "db-roles") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {{- include "ostrom.labels" (dict "root" . "component" "db-roles") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: roles
          image: {{ include "ostrom.thirdPartyImage" $pg.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for _ in $(seq 1 60); do pg_isready -h "$PGHOST" -U postgres -d postgres -q && break; sleep 2; done
              psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U postgres -d postgres \
                -v owner="$OSTROM_OWNER" -v app="$OSTROM_APP" -v db="$OSTROM_DB" <<'SQL'
              {{- include "ostrom.postgresql.tenantSql" . | nindent 14 }}
              SQL
          env:
            - { name: PGHOST, value: {{ $host | quote }} }
            - { name: PGCONNECT_TIMEOUT, value: "10" }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "ostrom.postgresql.secretName" . }}, key: postgres-password }
            - { name: OSTROM_DB, value: {{ $pg.database | quote }} }
            - { name: OSTROM_OWNER, value: {{ $pg.ownerUsername | quote }} }
            - { name: OSTROM_APP, value: {{ $pg.username | quote }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
{{- end }}
